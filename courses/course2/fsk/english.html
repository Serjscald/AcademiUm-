<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Английский язык — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css?v=6.16.0">
    <link rel="stylesheet" href="../../../css/management-v6.11.0.css?v=6.16.0"><link rel="stylesheet" href="../../../css/english.css?v=6.16.0">
<link rel="stylesheet" href="../../../css/subject-unified-v6.16.0.css?v=6.16.0"></head>
<body class="psy-page english-page">

<canvas id="fireworks-canvas"></canvas>

<main class="app-container" id="app"></main>

<script src="../../../js/core.js?v=6.16.0"></script><script src="../../../js/learning-progress-v6.15.0.js?v=6.15.0"></script>
<script src="../../../js/data-english.js"></script>
<script src="../../../js/english-quiz.js?v=6.13.0"></script>
<script>
var app = document.getElementById('app');
var currentCards = [];
var cardIndex = 0;
var quizIndex = 0;
var mistakes = 0;
var currentMode = 'learn';
var currentQuizDirection = 'term-to-def';
var englishLearningScope = null;
var englishLearningStore = null;
function englishSaveLearning(){if(currentMode==='learn'&&englishLearningStore)englishLearningStore.save(currentCards.map(function(c){return englishDB[englishLearningScope].indexOf(c);}),cardIndex);}
function englishRestartLearning(){if(englishLearningStore)englishLearningStore.clear();startTopic(englishLearningScope,null,true);}

function renderScreen(screenName, data) {
    app.innerHTML = '';
    
    if (screenName === 'modes') {
        app.innerHTML = '<div class="psy-kicker">АкадемиУм! · Английский язык</div><h1>Английский язык</h1><p class="psy-muted">Изучаем слова, грамматику и устойчивые выражения.</p><div class="psy-grid"><button type="button" class="psy-btn" onclick="handleMode(\'learn\',this)">Обучение</button><button type="button" class="psy-btn" onclick="handleMode(\'quiz\',this)">Контроль</button></div><button class="psy-btn" onclick="navigateTo(\'index.html\')">Назад</button>';
    } else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn';
        currentMode = mode;
        var title = (mode === 'learn') ? 'Обучение' : 'Контроль';
        var topicsHTML = '';
        if (mode === 'quiz') {
            topicsHTML += '<button type="button" class="psy-topic" onclick="startTopic(\'all\',this)">За все время</button>';
        }
        for (var key in englishDB.topicTitles) {
            topicsHTML += '<button type="button" class="psy-topic" onclick="startTopic(\'' + key + '\',this)">' + englishDB.topicTitles[key] + '</button>';
        }
        app.innerHTML = '<div class="psy-kicker">'+title+'</div><h1>Выберите тему</h1><div class="psy-topics">' + topicsHTML + '</div><button class="psy-btn" onclick="renderScreen(\'modes\')">Назад</button>';
    } else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        var extra = (card.note ? '<div class="english-teacher-note"><strong>💡 Пояснение</strong><p>' + card.note + '</p></div>' : '') + (card.example ? '<div class="english-teacher-example"><strong>Пример:</strong> ' + card.example + '</div>' : '');
        app.innerHTML = '<div class="psy-progress"><span>Обучение</span><span>'+(cardIndex+1)+' / '+currentCards.length+'</span></div><div class="psy-meter"><div style="width:'+((cardIndex+1)/currentCards.length*100).toFixed(1)+'%"></div></div><section class="flashcard psy-card"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div>' + extra + '</section><button class="psy-btn primary" onclick="nextCard()">Следующая карточка →</button><button class="psy-btn" onclick="englishRestartLearning()">Начать заново</button><button class="psy-btn" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    } else if (screenName === 'quiz') {
        englishQuizRender();
    } else if (screenName === 'result') {
        var isWin = (mistakes === 0);
        var msg = isWin ? '🎉 Отличная работа!' : 'Нужно заниматься усерднее, Данечка!';
        var cls = isWin ? 'result-win' : 'result-lose';
        app.innerHTML = '<div class="psy-kicker">Контроль</div><h1>Результат</h1><div class="psy-card result-msg ' + cls + '">' + msg + '</div><button class="psy-btn primary" onclick="renderScreen(\'modes\')">В меню</button><button class="psy-btn" onclick="navigateTo(\'../../../index.html\')">На главную</button>';
        if (isWin) startFireworks();
    }
}

function handleMode(mode, el) {
    el.classList.add('success');
    playSound('success');
    setTimeout(function(){ renderScreen('topics', {mode: mode}); }, 400);
}

function startTopic(scope, el, reset) {
    if(el)el.classList.add('success');
    playSound('success');
    if (scope === 'all') {
        currentCards = [];
        for (var key in englishDB.topicTitles) {
            currentCards = currentCards.concat(englishDB[key]);
        }
    } else {
        currentCards = englishDB[scope].slice();
    }
    if (currentMode === 'learn') {
        englishLearningScope=scope;
        currentCards=englishQuizShuffle(currentCards);
        englishLearningStore=window.AcademiumProgress&&scope!=='all'?window.AcademiumProgress.create('english',scope,englishDB[scope]):null;
        var prev=englishLearningStore&&!reset?englishLearningStore.load():null;
        if(prev){currentCards=prev.order.map(function(i){return englishDB[scope][i];});cardIndex=prev.index;}
        else cardIndex=0;
        englishSaveLearning();
    }
    if (currentMode === 'learn') {
        setTimeout(function(){ renderScreen('flashcard'); }, 400);
    } else {
        quizIndex = 0; mistakes = 0;
        setTimeout(function(){ englishQuizStart(scope); }, 400);
    }
}

function nextCard() {
    playSound('success');
    cardIndex++;
    if (cardIndex >= currentCards.length && englishLearningStore){englishLearningStore.clear();englishLearningStore=null;}
    else englishSaveLearning();
    if (cardIndex < currentCards.length) renderScreen('flashcard');
    else renderScreen('topics', {mode: 'learn'});
}

function checkAnswer(el, selected, correct) {
    var card = document.getElementById('quiz-card');
    if (selected === correct) {
        el.classList.add('correct'); card.classList.add('correct-flash'); playSound('success');
    } else {
        el.classList.add('wrong'); card.classList.add('wrong-flash'); playSound('error'); mistakes++;
    }
    setTimeout(function(){
        quizIndex++;
        if (quizIndex < currentCards.length) renderScreen('quiz');
        else renderScreen('result');
    }, 600);
}

renderScreen('modes');
</script>
</body>
</html>
