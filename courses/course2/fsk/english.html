<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Английский язык — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/english.css?v=6.4.2">
</head>
<body>

<div id="start-screen">
    <h2>🇬 Английский язык</h2>
    <p>Нажмите, чтобы начать обучение</p>
</div>

<canvas id="fireworks-canvas"></canvas>

<div class="app-container" id="app"></div>

<script src="../../../js/core.js"></script>
<script src="../../../js/data-english.js"></script>
<script src="../../../js/english-quiz.js?v=6.4.2"></script>
<script>
var app = document.getElementById('app');
var currentCards = [];
var cardIndex = 0;
var quizIndex = 0;
var mistakes = 0;
var currentMode = 'learn';
var currentQuizDirection = 'term-to-def';

function renderScreen(screenName, data) {
    app.innerHTML = '';
    
    if (screenName === 'modes') {
        app.innerHTML = '<h1>Английский язык</h1><div class="subtitle">Выберите режим</div><div class="grid" style="margin-top:40px"><div class="tile" onclick="handleMode(\'learn\')">Обучение</div><div class="tile" onclick="handleMode(\'quiz\')">Контроль</div></div><button class="btn btn-back" onclick="navigateTo(\'index.html\')">Назад</button>';
    } else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn';
        currentMode = mode;
        var title = (mode === 'learn') ? 'Обучение' : 'Контроль';
        var topicsHTML = '';
        if (mode === 'quiz') {
            topicsHTML += '<div class="tile" onclick="startTopic(\'all\')">За все время</div>';
        }
        for (var key in englishDB.topicTitles) {
            topicsHTML += '<div class="tile" onclick="startTopic(\'' + key + '\')">' + englishDB.topicTitles[key] + '</div>';
        }
        app.innerHTML = '<h1>' + title + '</h1><div class="subtitle">Выберите тему</div><div class="grid single-col" style="margin-top:20px">' + topicsHTML + '</div><button class="btn btn-back" onclick="renderScreen(\'modes\')">Назад</button>';
    } else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        var extra = (card.note ? '<div class="english-teacher-note"><strong>💡 Пояснение</strong><p>' + card.note + '</p></div>' : '') + (card.example ? '<div class="english-teacher-example"><strong>Пример:</strong> ' + card.example + '</div>' : '');
        app.innerHTML = '<h1>Карточка ' + (cardIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div>' + extra + '</div><button class="btn btn-orange" onclick="nextCard()">Следующая</button><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    } else if (screenName === 'quiz') {
        englishQuizRender();
    } else if (screenName === 'result') {
        var isWin = (mistakes === 0);
        var msg = isWin ? '🎉 Отличная работа!' : 'Нужно заниматься усерднее, Данечка!';
        var cls = isWin ? 'result-win' : 'result-lose';
        app.innerHTML = '<h1>Результат</h1><div class="result-msg ' + cls + '">' + msg + '</div><button class="btn btn-orange" onclick="renderScreen(\'modes\')">В меню</button><button class="btn btn-back" onclick="navigateTo(\'../../../index.html\')">На главную</button>';
        if (isWin) startFireworks();
    }
}

function handleMode(mode) {
    var el = event.target;
    el.classList.add('success');
    playSound('success');
    setTimeout(function(){ renderScreen('topics', {mode: mode}); }, 400);
}

function startTopic(scope) {
    var el = event.target;
    el.classList.add('success');
    playSound('success');
    if (scope === 'all') {
        currentCards = [];
        for (var key in englishDB.topicTitles) {
            currentCards = currentCards.concat(englishDB[key]);
        }
    } else {
        currentCards = englishDB[scope].slice();
    }
    if (currentMode === 'learn') currentCards = englishQuizShuffle(currentCards);
    if (currentMode === 'learn') {
        cardIndex = 0;
        setTimeout(function(){ renderScreen('flashcard'); }, 400);
    } else {
        quizIndex = 0; mistakes = 0;
        setTimeout(function(){ englishQuizStart(scope); }, 400);
    }
}

function nextCard() {
    playSound('success');
    cardIndex++;
    if (cardIndex < currentCards.length) renderScreen('flashcard');
    else renderScreen('topics', {mode: 'learn'});
}

function checkAnswer(el, selected, correct) {
    var card = document.getElementById('quiz-card');
    if (selected === correct) {
        el.classList.add('correct'); card.classList.add('correct-flash'); playSound('success');
    } else {
        el.classList.add('wrong'); card.classList.add('wrong-flash'); playSound('error'); mistakes++;
    }
    setTimeout(function(){
        quizIndex++;
        if (quizIndex < currentCards.length) renderScreen('quiz');
        else renderScreen('result');
    }, 600);
}

var startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', function(){
    initAudio();
    startScreen.style.opacity = '0';
    setTimeout(function(){ startScreen.style.display = 'none'; }, 500);
    renderScreen('modes');
});
</script>
</body>
</html>
