<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практические задачи по статистике — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css?v=6.16.0">
    <!-- Scoped mobile-first styling: affects statistics index tasks only. -->
    <link rel="stylesheet" href="../../../css/statistics-practice.css?v=22-integration">
</head>
<body>

<div id="start-screen">
    <h2>📊 Задачи по статистике</h2>
    <p>Нажмите, чтобы перейти к задачам</p>
</div>

<canvas id="fireworks-canvas"></canvas>
<div class="app-container" id="app"></div>
<div class="var-menu" id="varMenu"></div>

<script src="../../../js/statistics-practice-core.js?v=22-3-safari-audio"></script>
<script src="../../../js/statistics-practice-data.js?v=22-integration"></script>
<script>
var app = document.getElementById('app');
var currentCards = [];
var cardIndex = 0;
var quizIndex = 0;
var mistakes = 0;
var currentMode = 'learn';
var currentQuizDirection = 'term-to-def';
var currentTask = null;
var taskVars = {};
var assignedVars = {};
var activeCell = null;
var isSolved = false;
var theatreGuide = null; // Пятишаговый разбор только для task_1_3
// v21.1: салют при завершении учебного решения, независимо от ошибок по пути.
// Состояние сбрасывается только при запуске новой задачи, не при переходе между этапами.
var statisticsCelebrationPlayed = false;
function statisticsCelebrateOnce(){
    if(statisticsCelebrationPlayed) return;
    statisticsCelebrationPlayed = true;
    // v21.3: общий финальный блок после фактического завершения.
    statisticsJourneyScheduleFinish();
    try {
        if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
            // Уважаем настройку уменьшения анимации: звуковой сигнал без частиц.
            if(typeof playSound==='function') playSound('success');
        } else if(typeof startFireworks==='function') {
            // Оставляем реализацию анимации и звука в исходном core.js.
            startFireworks();
        }
    } catch(error) {
        console.warn('Поздравление не удалось показать:',error);
    }
}


// v21.2: каждый правильный ответ принимается один раз, отдельно от соседних ошибок.
// Подходит для select, input и старых карточек без изменения формул задач.
function statisticsAcceptElement(element, markerParent){
    if(!element || element.dataset.statisticsAccepted==='yes')return;
    element.dataset.statisticsAccepted='yes';
    element.disabled=true;
    element.classList.add('statistics-answer-accepted');
    element.removeAttribute('aria-invalid');
    var target=markerParent||element.parentElement;
    if(!target)return;
    var badge=document.createElement('span');
    badge.className='statistics-accepted-label';
    badge.textContent='✓ Ответ принят';
    badge.setAttribute('role','status');
    target.appendChild(badge);
}
function statisticsAcceptBatch(entries, invalidClass){
    var wrong=[];
    entries.forEach(function(entry){
        var element=entry.element||document.getElementById(entry.id);
        if(!element)return void wrong.push(entry.id||'нет поля');
        if(element.dataset.statisticsAccepted==='yes')return;
        if(entry.valid ? entry.valid(element) : element.value===entry.expected){
            element.classList.remove(invalidClass);
            statisticsAcceptElement(element,entry.parent);
        }else{
            element.classList.add(invalidClass);
            wrong.push(entry.id||'неверное значение');
        }
    });
    return {wrong:wrong,accepted:entries.length-wrong.length,total:entries.length};
}
function statisticsAcceptProgress(result){
    return 'Засчитано '+result.accepted+' из '+result.total+'. Правильные ответы сохранены; исправь только выделенные ошибки.';
}

// v21.3: единый ненавязчивый навигатор. Не изменяет решения задач.
// Состояния читаются из существующих движков; для каждой задачи разный набор этапов.
var statisticsJourneyLastKey = '';
var statisticsJourneyScheduled = false;
var statisticsJourneyFinalPending = false;
var statisticsJourneyStages = {
    index_table:1, logic_audit:1, grouping_frequency:1, agency_intervals:2,
    graduation_ratios:1, equipment_dynamics:3, productivity_compound:3,
    weighted_mean_rank:3, bank_weighted_mean:3, commute_grouped_distribution:3,
    variation_culture_grouped:3, variation_ranks_discrete:4, variation_loan_rates:4,
    dynamics_costs:4, dynamics_advertising:4, trend_costs:4, trend_advertising:5
};
function statisticsJourneySnapshot(){
    if(app.dataset.statisticsView!=='task' || !currentTask) return null;
    var t=currentTask.type, state=null, stage=1, done=false, guide=null, prefix='';
    switch(t){
        case 'index_table': done=!!theatreGuide; guide=done?theatreGuide.current:null; break;
        case 'logic_audit': state=logicState; done=!!(state&&state.finished); guide=done?state.current:null; break;
        case 'grouping_frequency': state=groupingState; done=!!(state&&state.finished); guide=done?state.current:null; break;
        case 'agency_intervals': state=agencyState; stage=state&&state.phase==='assign'?1:2; done=!!(state&&state.finished); guide=done?state.guideIndex:null; break;
        case 'graduation_ratios': state=graduationState; done=!!(state&&state.finished); guide=done?state.guideIndex:null; break;
        case 'equipment_dynamics': state=equipmentState; stage=state?({totals:1,change:2,relations:3}[state.stage]||3):1; done=!!(state&&state.complete);guide=done?state.position:null;prefix='equipment';break;
        case 'productivity_compound':state=productivityState;prefix='productivity';break;
        case 'weighted_mean_rank':state=meanState;prefix='mean';done=!!(state&&state.done);guide=done?state.guideStep:null;break;
        case 'bank_weighted_mean':state=bankState;prefix='bank';done=!!(state&&state.completed);guide=done?state.guide:null;break;
        case 'commute_grouped_distribution':state=commuteState;prefix='commute';done=!!(state&&state.completed);guide=done?state.guideStep:null;break;
        case 'variation_culture_grouped':state=variationState;prefix='variation';break;
        case 'variation_ranks_discrete':state=rankState;prefix='rank';break;
        case 'variation_loan_rates':state=loanState;prefix='loan';break;
        case 'dynamics_costs':state=dynState;prefix='dyn';break;
        case 'dynamics_advertising':state=adynState;prefix='adyn';break;
        case 'trend_costs':state=trendState;prefix='trend';break;
        case 'trend_advertising':state=trend2State;prefix='trend2';break;
        default:return null;
    }
    if(state){
        if(typeof state.stage==='number')stage=state.stage;
        if(t==='productivity_compound'){done=!!state.complete;guide=done?state.position:null;}
        if(t==='equipment_dynamics'){done=!!state.complete;guide=done?state.position:null;}
        if(['variation_culture_grouped','variation_ranks_discrete','variation_loan_rates','dynamics_costs','dynamics_advertising','trend_costs','trend_advertising'].indexOf(t)!==-1){
            done=!!state.done;guide=done?state.guide:null;
        }
    }
    var total=statisticsJourneyStages[t]||1;
    stage=Math.min(total,Math.max(1,Number(stage)||1));
    // Салют запускается только при полном завершении; счётчик руководства иногда равен 5.
    var finished=statisticsCelebrationPlayed;
    var mode=finished?'finished':done?'guide':'stage';
    var current=(mode==='guide')?Math.min(5,Math.max(1,(Number(guide)||0)+1)):stage;
    var key=currentTask.id+'|'+mode+'|'+current;
    return {key:key,mode:mode,stage:stage,total:total,step:current,prefix:prefix,taskId:currentTask.id};
}
function statisticsJourneyRefresh(){
    if(statisticsJourneyScheduled)return;
    statisticsJourneyScheduled=true;
    requestAnimationFrame(function(){statisticsJourneyScheduled=false;statisticsJourneyPaint();});
}
function statisticsJourneyPaint(){
    var snapshot=statisticsJourneySnapshot();
    var existing=document.getElementById('statistics-journey');
    if(!snapshot){ if(existing)existing.remove(); statisticsJourneyLastKey='';return; }
    if(!existing){
        existing=document.createElement('nav');
        existing.id='statistics-journey';
        existing.className='statistics-journey';
        existing.setAttribute('aria-label','Прогресс выполнения задачи');
        app.insertBefore(existing,app.firstChild);
    }
    var oldKey=statisticsJourneyLastKey;
    if(oldKey!==snapshot.key){
        var label=snapshot.mode==='finished'?'🎓 Задача завершена':snapshot.mode==='guide'?'📖 Разбор: шаг '+snapshot.step+' из 5':'🧭 Этап '+snapshot.stage+' из '+snapshot.total;
        var progress=snapshot.mode==='finished'?100:snapshot.mode==='guide'?Math.round(snapshot.step/5*100):Math.round(snapshot.stage/snapshot.total*100);
        existing.innerHTML='<div class="statistics-journey-head"><strong>'+label+'</strong><button type="button" onclick="statisticsJourneyGoToCurrent()" aria-label="Перейти к текущему этапу">↓ К текущему этапу</button></div>'+
            '<div class="statistics-journey-track" role="progressbar" aria-label="Прогресс текущего этапа" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+progress+'"><span style="width:'+progress+'%"></span></div>';
        statisticsJourneyLastKey=snapshot.key;
        // Автоматическая прокрутка только при РЕАЛЬНОМ переходе вперёд,
        // не при раскрытии подсказок, ошибке или возврате к другой задаче.
        if(oldKey && oldKey.split('|')[0]===snapshot.taskId){
            var bits=oldKey.split('|'),oldMode=bits[1],oldN=Number(bits[2]);
            var forward=(oldMode==='stage'&&snapshot.mode==='stage'&&snapshot.stage>oldN) ||
                (oldMode==='stage'&&snapshot.mode==='guide') ||
                (oldMode==='guide'&&snapshot.mode==='guide'&&snapshot.step>oldN);
            if(forward){
                // В существующих движках есть собственная прокрутка. Навигатор
                // перемещает к тому же этапу после отрисовки, без скачка на подсказке.
                requestAnimationFrame(function(){statisticsJourneyGoToCurrent(snapshot);});
            }
        }
    }
    statisticsMobileEnhanceTables();
}
// v21.5: a wide statistical table stays horizontally scrollable and is
// discoverable on a narrow screen; keyboard users can focus the scroll area.
function statisticsMobileEnhanceTables(){
    if(!window.matchMedia || !window.matchMedia('(max-width: 768px)').matches)return;
    app.querySelectorAll('*').forEach(function(wrapper){
        if(!wrapper.querySelector || !wrapper.querySelector('table'))return;
        var overflow=getComputedStyle(wrapper).overflowX;
        if(overflow!=='auto' && overflow!=='scroll')return;
        if(wrapper.scrollWidth<=wrapper.clientWidth+8)return;
        if(wrapper.dataset.statisticsTableMobile==='yes')return;
        wrapper.dataset.statisticsTableMobile='yes';
        if(!wrapper.hasAttribute('tabindex'))wrapper.setAttribute('tabindex','0');
        if(!wrapper.hasAttribute('role'))wrapper.setAttribute('role','region');
        if(!wrapper.hasAttribute('aria-label'))wrapper.setAttribute('aria-label','Таблица: прокручивается горизонтально');
        var hint=document.createElement('p');
        hint.className='statistics-table-scroll-hint';
        hint.textContent='↔ Листай таблицу вправо и влево';
        wrapper.insertAdjacentElement('beforebegin',hint);
    });
}
function statisticsJourneyTarget(snapshot){
    var s=snapshot||statisticsJourneySnapshot();if(!s)return null;
    if(s.mode==='finished')return document.getElementById('statistics-journey-finish');
    if(s.mode==='guide'){
        return document.getElementById(s.prefix+'-guide-panel') ||
            app.querySelector('.index-walkthrough, .dyn-guide, .statistics-guide, [class*="guide-panel"], [class*="guide-box"]') ||
            document.getElementById(s.prefix+'-guide');
    }
    var ids=[];
    if(s.prefix==='equipment')ids=['equipment-stage-'+(['totals','change','relations'][s.stage-1])];
    else if(s.prefix)ids=[s.prefix+'-stage-'+s.stage];
    if(s.prefix==='dyn')ids=['dyn-stage-'+s.stage];
    for(var i=0;i<ids.length;i++){var element=document.getElementById(ids[i]);if(element && !element.hidden)return element;}
    return app.querySelector('[id$="-stage-'+s.stage+'"]')||app.querySelector('h1');
}
function statisticsJourneyGoToCurrent(snapshot){
    var target=statisticsJourneyTarget(snapshot);
    if(!target)return;
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}
function statisticsJourneyScheduleFinish(){
    if(statisticsJourneyFinalPending)return;
    statisticsJourneyFinalPending=true;
    // В ряде задач поздравление вызывается ПЕРЕД заменой HTML финального шага.
    requestAnimationFrame(function(){requestAnimationFrame(function(){
        statisticsJourneyFinalPending=false;
        if(!statisticsCelebrationPlayed || app.dataset.statisticsView!=='task'||!currentTask)return;
        if(!document.getElementById('statistics-journey-finish')){
            var finish=document.createElement('section');
            finish.id='statistics-journey-finish';
            finish.className='statistics-journey-finish';
            finish.setAttribute('aria-label','Завершение задачи');
            finish.innerHTML='<div class="statistics-journey-finish-icon" aria-hidden="true">🎓</div><h2>Задача завершена!</h2>'+
                '<p>Ты дошёл до конца разбора. Правильные решения можно закрепить повторным прохождением.</p>'+
                '<div class="statistics-journey-finish-actions"><button type="button" onclick="renderScreen(\'task\')">↻ Повторить задачу</button>'+
                '<button type="button" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">← К списку задач</button></div>';
            app.appendChild(finish);
        }
        statisticsJourneyRefresh();
    });});
}
// Один наблюдатель вместо правки 19 разных движков задач.
var statisticsJourneyObserver=new MutationObserver(function(){statisticsJourneyRefresh();});
statisticsJourneyObserver.observe(app,{childList:true,subtree:true});
// Full statistical tables often live inside <details>; opening them changes layout
// without adding child nodes, so refresh scroll cues on native toggle events.
app.addEventListener('toggle',function(event){
    if(event.target && event.target.tagName==='DETAILS')statisticsJourneyRefresh();
},true);

var logicState = null; // Состояние логического контроля, не затрагивает индексные задачи
var groupingState = null; // Состояние задания 2.2: частотные группировки сотрудников
var equipmentState = null; // Тема 4, задача 2: динамика и структура
var productivityState = null; // Тема 4, задача 3: последовательные проценты
var meanState = null; // Тема 5, задача 1: взвешенная средняя
var bankState = null; // Тема 5, задача 2: средний банковский вклад
var commuteState = null; // Тема 5, задача 3: время поездки, средняя, мода, медиана
var variationState = null; // Тема 6, задача 1: посещаемость и показатели вариации
var rankState = null; // Тема 6, задача 2: разряды сотрудников
var loanState = null; // Тема 6, задача 3: квартальные ставки по объёму займов
var dynState = null; // Тема 7, задача 1: ряды динамики
var adynState = null; // Тема 7, задача 2: фактическое производство и прогноз
var trendState = null; // Тема 8, задача 1: линейный тренд и трёхлетнее сглаживание
var graduationState = null; // Тема 4, задача 1: выбор отношений → автоматический расчёт → объяснение
var agencyState = null; // Задание 2.3: интервалы → автосводка с происхождением сумм → объяснение

function renderScreen(screenName, data) {
    if (screenName === 'modes') { window.location.assign('statistics.html'); return; }
    app.dataset.statisticsView = screenName;
    app.innerHTML = '';
    if (screenName !== 'task') {
        statisticsJourneyLastKey = '';
        requestAnimationFrame(function(){ window.scrollTo({top:0,behavior:'auto'}); });
    }
    app.classList.remove('statistics-index-screen');
    document.body.classList.remove('statistics-index-active', 'statistics-logic-active', 'statistics-grouping-active', 'statistics-agency-active', 'statistics-graduation-active', 'statistics-equipment-active', 'statistics-productivity-active', 'statistics-mean-active', 'statistics-bank-active', 'statistics-commute-active', 'statistics-variation-active', 'statistics-rank-active', 'statistics-loan-active', 'statistics-dyn-active', 'statistics-trend-active', 'statistics-trend2-active');
    app.classList.remove('statistics-logic-screen', 'statistics-grouping-screen', 'statistics-agency-screen', 'statistics-graduation-screen', 'statistics-equipment-screen', 'statistics-productivity-screen', 'statistics-mean-screen', 'statistics-bank-screen', 'statistics-commute-screen', 'statistics-variation-screen', 'statistics-rank-screen', 'statistics-loan-screen', 'statistics-dyn-screen', 'statistics-ads-screen', 'statistics-trend-screen', 'statistics-trend2-screen');

    if (screenName === 'modes') {
        app.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding-top:50px;">
                <h1 style="color:#ecc94b; margin-bottom:10px; font-size:32px; letter-spacing:1px;">СТАТИСТИКА</h1>
                <div class="subtitle" style="margin-bottom:40px; color:#a0aec0;">Выберите режим</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; width:100%; max-width:400px;">
                    <div class="tile" onclick="handleMode('learn',this)" style="text-align:center; padding:20px; cursor:pointer;">Обучение</div>
                    <div class="tile" onclick="handleMode('quiz',this)" style="text-align:center; padding:20px; cursor:pointer;">Контроль</div>
                    <div class="tile" onclick="handleMode('tasks',this)" style="text-align:center; padding:20px; cursor:pointer; grid-column: span 2;">Задачи</div>
                </div>
                <button class="btn btn-back" onclick="navigateTo('index.html')" style="margin-top:30px; width:100%; max-width:400px;">НАЗАД</button>
            </div>
        `;
    }
    else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn';
        currentMode = mode;

        var title = (mode === 'learn') ? 'Обучение' : (mode === 'quiz' ? 'Контроль' : 'Задачи');

        if (mode === 'tasks') {
            var html = '<h1>' + title + '</h1>';

            html += '<div style="margin-bottom:30px;">';
            html += '<button onclick="startRandomTask(this)" style="width:100%; max-width:400px; padding:15px; font-size:18px; background:#f59e0b; color:white; border:none; border-radius:8px; cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">🎲 Случайная задача (из всех тем)</button>';
            html += '</div>';

            html += '<div class="subtitle" style="margin-bottom:15px;">Выберите тему:</div>';
            html += '<div class="grid single-col" style="max-width:500px; margin:0 auto;">';

            var topics = {};
            for(var i=0; i<statisticsTasks.length; i++) {
                var tId = statisticsTasks[i].topicId;
                var tName = statisticsTasks[i].topicName;
                if(!topics[tId]) topics[tId] = tName;
            }

            for(var key in topics) {
                html += '<div class="tile statistics-topic-tile" onclick="showTopicTasks(\''+key+'\')">';
                html += '<span class="statistics-topic-title">' + topics[key] + '</span>';
                html += '<span class="statistics-topic-arrow" aria-hidden="true">➜</span>';
                html += '</div>';
            }

            html += '</div>';
            html += '<button class="btn btn-back" onclick="renderScreen(\'modes\')" style="margin-top:30px;">Назад</button>';

            app.innerHTML = html;
        }
        else {
            var topicsHTML = '';
            if (mode === 'quiz') {
                topicsHTML += '<div class="tile" onclick="startTopic(\'all\',this)">За все время</div>';
            } else {
                for (var key in statisticsDB.topicTitles) {
                    topicsHTML += '<div class="tile" onclick="startTopic(\'' + key + '\',this)">' + statisticsDB.topicTitles[key] + '</div>';
                }
            }
            app.innerHTML = '<h1>' + title + '</h1><div class="subtitle">Выберите тему</div><div class="grid single-col" style="margin-top:20px">' + topicsHTML + '</div><button class="btn btn-back" onclick="renderScreen(\'modes\')">Назад</button>';
        }
    }
    else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        app.innerHTML = '<h1>Карточка ' + (cardIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div></div><button class="btn btn-orange" onclick="nextCard()">Следующая</button><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    }
    else if (screenName === 'quiz') {
        var qcard = currentCards[quizIndex];
        currentQuizDirection = (Math.random() < 0.5) ? 'term-to-def' : 'def-to-term';
        var questionText, correctAnswer, optionsPool;

        if (currentQuizDirection === 'term-to-def') {
            questionText = qcard.word; correctAnswer = qcard.trans;
            optionsPool = currentCards.map(function(c){ return c.trans; });
        } else {
            questionText = qcard.trans; correctAnswer = qcard.word;
            optionsPool = currentCards.map(function(c){ return c.word; });
        }

        var options = [correctAnswer];
        while (options.length < 3) {
            var rnd = optionsPool[Math.floor(Math.random() * optionsPool.length)];
            if (options.indexOf(rnd) === -1) options.push(rnd);
        }
        options.sort(function(){ return Math.random() - 0.5; });

        var optsHTML = '';
        for (var i = 0; i < options.length; i++) {
            var o = options[i].replace(/'/g, "\\'");
            var ca = correctAnswer.replace(/'/g, "\\'");
            var disp = options[i].substring(0, 100) + (options[i].length > 100 ? '...' : '');
            optsHTML += '<div class="quiz-opt" onclick="checkAnswer(this,\'' + o + '\',\'' + ca + '\')">' + disp + '</div>';
        }

        var hint = (currentQuizDirection === 'term-to-def') ? 'Выберите определение:' : 'Выберите термин:';
        app.innerHTML = '<h1>Контроль ' + (quizIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard" id="quiz-card"><div class="fc-word" style="font-size:20px">' + questionText + '</div><div class="fc-trans" style="font-size:14px;color:var(--text-muted)">' + hint + '</div></div><div class="quiz-options">' + optsHTML + '</div><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'quiz\'})">Прервать</button>';
    }
    else if (screenName === 'task') {
        statisticsCelebrationPlayed = false;
        assignedVars = {};
        taskVars = {};
        isSolved = false;
        theatreGuide = null;
        logicState = null;
        groupingState = null;
        agencyState = null;
        graduationState = null;
        equipmentState = null;
        productivityState = null;
        meanState = null;
        bankState = null;
        commuteState = null;
        variationState = null;
        rankState = null;
        loanState = null;
        dynState = null;
        adynState = null;
        trendState = null;
        trend2State = null;

var productivityState = null;
function productFmt(value, digits) {
    return Number(value).toLocaleString('ru-RU', {
        minimumFractionDigits: digits === undefined ? 0 : digits,
        maximumFractionDigits: digits === undefined ? 0 : digits
    });
}
function productivityValues() {
    var d = currentTask;
    var factorPlan = 1 + d.planIncreasePercent / 100;
    var factorFact = 1 + d.planOverfulfilPercent / 100;
    var planned = d.previousLevel * factorPlan;
    var actual = planned * factorFact;
    return {
        base:d.previousLevel, factorPlan:factorPlan, factorFact:factorFact,
        planned:planned, actual:actual,
        plannedExtra:planned-d.previousLevel,
        factExtra:actual-planned,
        totalExtra:actual-d.previousLevel,
        totalPercent:(factorPlan*factorFact-1)*100
    };
}
function productFocus(selector) {

function agencyGroupForProduction(x) {
    if (x >= 105 && x < 205) return 0;
    if (x >= 205 && x < 305) return 1;
    if (x >= 305 && x <= 405) return 2;
    return -1;
}

function agencyExpectedTotals() {
    var result = currentTask.intervals.map(function() {return {count:0,production:0,wages:0};});
    currentTask.agencies.forEach(function(a) {
        var group = agencyGroupForProduction(a.production);
        if (group < 0) return;
        result[group].count += 1;
        result[group].production += a.production;
        result[group].wages += a.wages;

        'Высшее':'higher',

        'Среднее специальное':'vocational',
        'Незаконченное среднее':'incomplete-secondary'
    };

        var palette = category === 'gender' ? groupingGenderClasses : groupingEducationClasses;

            + '</span></div>';
    }).join('');

        return '<label class="group-count-row" data-group-id="' + htmlEscape(item.id) + '">'
            + groupingChip(item.label, item.category)
            + '<input type="number" name="' + htmlEscape(item.id) + '" min="0" max="25" step="1"'
            + ' inputmode="numeric" autocomplete="off" placeholder="?" aria-label="Число сотрудников: '
            + htmlEscape(item.label) + '" data-group-input="' + htmlEscape(item.id) + '">'
            + '</label>';

    var education = task.categories.filter(function(g) {return g.category==='education';}).map(makeInput).join('');
    app.innerHTML = '<section class="group-task-layout">'

function updateGroupingAnswer(input) {
    if (!groupingState || groupingState.finished) return;
    var id = input.getAttribute('data-group-input');
    groupingState.answers[id] = input.value.trim();
    var row = input.closest('.group-count-row');
    if (row) row.classList.remove('group-wrong');
    input.removeAttribute('aria-invalid');
    var complete = currentTask.categories.filter(function(g) {
        var text = groupingState.answers[g.id];
        return typeof text === 'string' && text !== '';
    }).length;
    document.getElementById('group-progress').textContent = 'Заполнено значений: ' + complete + ' / ' + currentTask.categories.length;
    document.getElementById('group-submit').disabled = complete !== currentTask.categories.length;
    document.getElementById('group-feedback').textContent = '';
}

function validateGrouping() {
    if (!groupingState || groupingState.finished) return;
    var wrong = currentTask.categories.filter(function(g) {
        var text=groupingState.answers[g.id];
        var good=text!==undefined && /^\d+$/.test(text) && Number(text)===g.count;
        if(good){var input=app.querySelector('[data-group-input="'+g.id+'"]');if(input)statisticsAcceptElement(input,input.closest('.group-count-row'));}
        return !good;
    });
    groupingState.attempts++;
    app.querySelectorAll('.group-count-row').forEach(function(row) {row.classList.remove('group-wrong');});
    var feedback = document.getElementById('group-feedback');
    if (wrong.length) {
        wrong.forEach(function(item) {
            var input = app.querySelector('[data-group-input="' + item.id + '"]');
            if (input) {
                input.setAttribute('aria-invalid','true');
                input.closest('.group-count-row').classList.add('group-wrong');
            }
        });
        playSound('error');
        feedback.className = 'group-feedback group-feedback-error';
        feedback.textContent = 'Засчитано '+(currentTask.categories.length-wrong.length)+' из '+currentTask.categories.length+'. Исправь только подсвеченные группы.';
        document.getElementById('group-submit').textContent = 'ПРОВЕРИТЬ СНОВА';
        return;
    }
    groupingState.finished = true;
    playSound('success');
    app.querySelectorAll('[data-group-input]').forEach(function(input) {input.disabled = true;});
    document.getElementById('group-submit').disabled = true;
    document.getElementById('group-submit').textContent = 'ГРУППИРОВКА ВЫПОЛНЕНА ✓';
    feedback.className = 'group-feedback group-feedback-success';
    feedback.textContent = 'Верно! Все 25 сотрудников учтены в обеих группировках. Теперь разберём решение по шагам.';
    renderGroupingGuideStep();
    focusGroupingGuideStep();
}

function focusGroupingGuideStep() {

}
function revealGroupingStep() {

function moveGroupingStep(direction) {
    if (!groupingState || !groupingState.finished) return;
    if (direction>0 && !groupingState.opened[groupingState.current]) return;
    var next = groupingState.current + direction;
    if (next<0) return;
    if (next>=currentTask.guideSteps.length) {
        document.getElementById('group-guide-area').innerHTML = '<section class="group-completed"><h2>🎓 Разбор завершён!</h2><p>Вы самостоятельно сгруппировали все 25 наблюдений по двум признакам и проверили частоты.</p><button type="button" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">К списку задач</button></section>';

var meanState = null;
function meanData() {
    var d=currentTask;
    var rows=d.ranks.map(function(rank,i){return {rank:rank,count:d.counts[i],part:rank*d.counts[i]};});
    var count=rows.reduce(function(s,r){return s+r.count;},0);
    var weighted=rows.reduce(function(s,r){return s+r.part;},0);
    return {rows:rows,count:count,weighted:weighted,average:weighted/count};
}

          +'<p class="mean-hint">Например, 26 сотрудников шестого разряда дают 6 × 26 = 156 единиц разряда в общей сумме. Это не средний разряд, а вклад группы.</p></div>';

        var countTerms=v.rows.map(function(r){return '<span class="mean-count">'+r.count+'</span>';}).join(' + ');
        var weightedTerms=v.rows.map(function(r){return '<span class="mean-contrib">'+r.part+'</span>';}).join(' + ');

        document.getElementById('mean-result-2').innerHTML='<div class="mean-result mean-sums">'
          +'<h3>Автоматически складываем выбранные столбцы</h3>'
          +'<div class="mean-sum-card mean-sum-count"><div class="mean-sum-card-head">Всего сотрудников — Σf</div><div class="mean-sum-equation">'+countTerms+' = <strong class="mean-count">'+v.count+' чел.</strong></div></div>'
          +'<div class="mean-sum-card mean-sum-weighted"><div class="mean-sum-card-head">Сумма взвешенных разрядов — Σ(x·f)</div><div class="mean-sum-equation">'+weightedTerms+' = <strong class="mean-contrib">'+v.weighted+'</strong></div></div>'
          +'<details class="mean-details"><summary>Проследить происхождение каждого слагаемого</summary><div class="mean-table-wrap"><table class="mean-table"><thead><tr><th>Разряд</th><th>Сотрудники</th><th>Вклад</th></tr></thead><tbody>'+detailRows+'</tbody></table></div></details>'
          +'<p class="mean-hint">'+v.count+' — это количество людей (знаменатель), а '+v.weighted+' — сумма их разрядов (числитель). В следующем этапе выберем, как найти средний разряд.</p></div>';

var bankState = null;

    var rows=currentTask.districts.map(function(d){

function bankCheck(stage){
    if(!bankState||bankState.completed||bankState.stage!==stage)return;
    var v=bankData(),field=document.getElementById('bank-choice-'+stage);
    if(!field||!field.value)return;
    var correct=(stage===1?'multiply':stage===2?'deposit-value':'weighted-ratio');
    var ok=field.value===correct;
    var feedback=document.getElementById('bank-feedback-'+stage);
    bankState.attempts++;
    field.classList.toggle('bank-invalid',!ok);
    feedback.className='bank-feedback '+(ok?'bank-good':'bank-bad');
    if(!ok){
        feedback.textContent=stage===1?
           'Чтобы перейти от одного отделения ко всему району, нужно учесть, сколько таких отделений. Сложение единиц измерения здесь не поможет.':
           stage===2?'Сумма вкладов района зависит от числа вкладов и среднего размера каждого, а не только от числа отделений.':
           'Чтобы получить средний размер одного вклада, общий объём вкладов нужно разделить на их общее количество.';
        if(typeof playSound==='function')playSound('error');return;
    }
    if(typeof playSound==='function')playSound('success');
    field.disabled=true;document.getElementById('bank-check-'+stage).disabled=true;
    bankState.stage++;
    if(stage===1){
        feedback.textContent='Верно! Число вкладов в районе равно числу отделений × среднее число вкладов в одном отделении.';
        var rows=v.rows.map(function(r){return '<tr><th scope="row">'+htmlEscape(r.name)+'</th><td><span class="bank-branch">'+bankFmt(r.branches)+'</span> × <span class="bank-frequency">'+bankFmt(r.perBranch)+'</span></td><td class="bank-deposits">'+bankFmt(r.deposits)+'</td></tr>';}).join('');
        document.getElementById('bank-result-1').innerHTML='<div class="bank-result"><h3>Автоматически находим количество вкладов</h3>'
          +'<div class="bank-table-wrap"><table class="bank-table"><thead><tr><th>Район</th><th>Расчёт</th><th>Вкладов</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          +'<details class="bank-details"><summary>Как получилось '+bankFmt(v.deposits)+' вкладов?</summary><p>'
          +v.rows.map(function(r){return '<span class="bank-deposits">'+bankFmt(r.deposits)+'</span>';}).join(' + ')
          +' = <strong class="bank-deposits">'+bankFmt(v.deposits)+'</strong> вкладов.</p></details>'
          +'<p class="bank-hint">Число вкладов становится <b>весом</b> при расчёте средней: у районов разное количество вкладов.</p></div>';
        bankRenderStage2(v);
    }else if(stage===2){
        feedback.textContent='Верно! Умножаем число вкладов в районе на их средний размер. Программа сложит полученные суммы.';
        var rows=v.rows.map(function(r){return '<tr><th scope="row">'+htmlEscape(r.name)+'</th><td><span class="bank-deposits">'+bankFmt(r.deposits)+'</span> × <span class="bank-average">'+bankFmt(r.avg)+'</span></td><td class="bank-volume">'+bankFmt(r.volume)+'</td></tr>';}).join('');
        document.getElementById('bank-result-2').innerHTML='<div class="bank-result"><h3>Расчётный объём вкладов по районам</h3>'
          +'<div class="bank-table-wrap"><table class="bank-table"><thead><tr><th>Район</th><th>Вклады × размер</th><th>Тыc. руб.</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          +'<details class="bank-details"><summary>Показать все слагаемые общего объёма</summary><p>'
          +v.rows.map(function(r){return '<span class="bank-volume">'+bankFmt(r.volume)+'</span>';}).join(' + ')
          +' = <strong class="bank-volume">'+bankFmt(v.volume)+'</strong> тыс. руб.</p></details>'
          +'<p class="bank-hint">Теперь известны обе нужные суммы: <strong class="bank-volume">'+bankFmt(v.volume)+'</strong> тыс. руб. и <strong class="bank-deposits">'+bankFmt(v.deposits)+'</strong> вкладов.</p></div>';
        bankRenderStage3(v);
    }else{
        feedback.textContent='Верно! Делим общую сумму средств на количество вкладов.';
        bankState.completed=true;bankRenderSummary(v);
    }
}

// === ТЕМА 5 / ЗАДАЧА 5.3: СРЕДНЕЕ ВРЕМЯ В ДОРОГЕ, МОДА И МЕДИАНА ===
// Данные: «Задачи средние статистические показатели», задача 3, стр. 1.
// Расчёты по сгруппированному ряду — оценки: индивидуальные времена неизвестны.
var commuteState = null;
function commuteData() {
    var rows=currentTask.intervals.map(function(d){return {
        left:d.left,right:d.right,count:d.count,
        label:d.left+'–'+d.right,
        mid:(d.left+d.right)/2,
        product:((d.left+d.right)/2)*d.count,
        cum:0
    };});
    var cum=0;rows.forEach(function(r){cum+=r.count;r.cum=cum;});
    var n=cum,weighted=rows.reduce(function(a,r){return a+r.product;},0);
    var maxRow=rows.reduce(function(a,r){return r.count>a.count?r:a;},rows[0]);
    var idx=rows.indexOf(maxRow),prev=idx?rows[idx-1].count:0,next=idx+1<rows.length?rows[idx+1].count:0;
    var width=maxRow.right-maxRow.left;
    var mode=maxRow.left+width*(maxRow.count-prev)/((maxRow.count-prev)+(maxRow.count-next));
    var medianIndex=rows.findIndex(function(r){return r.cum>=n/2;});
    var medianRow=rows[medianIndex],prior=medianIndex?rows[medianIndex-1].cum:0;
    var median=medianRow.left+(medianRow.right-medianRow.left)*(n/2-prior)/medianRow.count;
    return {rows:rows,n:n,weighted:weighted,mean:weighted/n,modal:maxRow,mode:mode,medianRow:medianRow,prior:prior,median:median,prev:prev,next:next,width:width};
}
function commuteFmt(value,precision){return Number(value).toLocaleString('ru-RU',{minimumFractionDigits:precision||0,maximumFractionDigits:precision||0});}
function commuteFocus(id){var el=document.getElementById(id);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'instant',block:'start'});}
function commuteChoice(id,title,choices){return '<label class="commute-select-label" for="'+id+'"><strong>'+title+'</strong><select id="'+id+'"><option value="">— Выбери ответ —</option>'+choices.map(function(c){return '<option value="'+c[0]+'">'+htmlEscape(c[1])+'</option>';}).join('')+'</select></label>';}
function commuteBind(ids,button,feedback){
    function update(){var all=ids.every(function(id){return !!document.getElementById(id).value;});document.getElementById(button).disabled=!all;}
    ids.forEach(function(id){document.getElementById(id).addEventListener('change',function(){this.classList.remove('commute-invalid');var f=document.getElementById(feedback);f.textContent='';f.className='commute-feedback';update();});});update();
}

    return '<div class="commute-table-scroll"><table class="commute-table"><thead>'+header+'</thead><tbody>'+v.rows.map(function(r){return '<tr><th scope="row">'+r.label+'</th><td class="commute-freq">'+commuteFmt(r.count)+'</td>'+(kind==='full'?'<td class="commute-mid">'+commuteFmt(r.mid)+'</td><td class="commute-weight">'+commuteFmt(r.product)+'</td><td class="commute-cumulative">'+commuteFmt(r.cum)+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>';
}

      +commuteChoice('commute-choice-1','Как представлять интервалы в расчёте?',[
        ['lower','Использовать только левую границу: 20 минут'],['mid','Использовать середину интервала: (20 + 30) / 2'],['upper','Использовать только правую границу: 30 минут']])
      +'<button class="commute-primary" type="button" id="commute-check-1" onclick="commuteCheck(1)" disabled>ПРОВЕРИТЬ РЕШЕНИЕ</button><div class="commute-feedback" id="commute-feedback-1" role="status" aria-live="polite"></div><div id="commute-result-1"></div></section>'

// === ТЕМА 6 / ЗАДАЧА 6.1: ПОСЕЩАЕМОСТЬ УЧРЕЖДЕНИЙ КУЛЬТУРЫ ===
// Авторская учебная механика. Числа исходного ряда взяты из PDF преподавателя.
// Для расчётов сгруппированного ряда берём середины интервалов; дисперсия
// описывает всю заданную совокупность учреждений (деление на N, не N-1).
var variationState = null;
function variationValues(){
    var raw=currentTask.intervals;
    var rows=raw.map(function(t){return {low:t.low,high:t.high,f:t.count,x:(t.low+t.high)/2,label:t.low+'–'+t.high};});
    var n=rows.reduce(function(v,r){return v+r.f;},0);
    var xf=rows.reduce(function(v,r){return v+r.x*r.f;},0),mean=xf/n;
    rows.forEach(function(r){r.xf=r.x*r.f;r.delta=r.x-mean;r.abs=Math.abs(r.delta);r.weightedAbs=r.f*r.abs;r.square=r.delta*r.delta;r.weightedSquare=r.f*r.square;});
    var absSum=rows.reduce(function(v,r){return v+r.weightedAbs;},0);
    var squareSum=rows.reduce(function(v,r){return v+r.weightedSquare;},0);
    var variance=squareSum/n,std=Math.sqrt(variance);
    return {rows:rows,n:n,xf:xf,mean:mean,range:rows[rows.length-1].high-rows[0].low,absSum:absSum,absMean:absSum/n,squareSum:squareSum,variance:variance,std:std,cv:std/mean*100};
}
function variationFmt(v,dec){return Number(v).toLocaleString('ru-RU',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0});}
function variationChoice(id,title,options){
    return '<label class="variation-select-label" for="'+id+'"><strong>'+title+'</strong><select id="'+id+'"><option value="">Выберите ответ…</option>'+options.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join('')+'</select></label>';
}
// Доступная ДО проверки добровольная помощь: не раскрывает вариант ответа.
// Нативный <details> обходится без JS-состояния и остаётся открытым при исправлении ошибки.

}
function variationBind(ids,buttonId){
    function change(){
        var ready=ids.every(function(id){return document.getElementById(id).value!=='';});
        document.getElementById(buttonId).disabled=!ready;
        ids.forEach(function(id){var el=document.getElementById(id);el.classList.remove('variation-invalid');});
    }
    ids.forEach(function(id){document.getElementById(id).addEventListener('change',change);});change();

      +'<section class="variation-panel variation-condition"><h2>📘 Условие</h2><p>'+htmlEscape(task.description)+'</p><p class="variation-warning">Посещаемость приведена <b>интервалами</b>. Для вычисления средней и отклонений будем использовать их середины: это <b>приближённые оценки</b>, а не точные индивидуальные значения.</p></section>'

function variationCheck(stage){

// === ТЕМА 6 / ЗАДАЧА 6.2: РАЗРЯДЫ 24 СОТРУДНИКОВ ===
// Дискретное распределение и описательные показатели всей данной совокупности.
// Асимметрия = центральный момент 3-го порядка / sigma^3;
// эксцесс = центральный момент 4-го порядка / sigma^4 - 3.
var rankState = null;
function rankData(){
  var raw=currentTask.ranks, n=raw.length, count={};
  raw.forEach(function(x){count[x]=(count[x]||0)+1;});
  var rows=Object.keys(count).map(Number).sort(function(a,b){return a-b;}).map(function(x){return {x:x,f:count[x],xf:x*count[x]};});
  var total=rows.reduce(function(s,r){return s+r.xf;},0),mean=total/n;
  var sorted=raw.slice().sort(function(a,b){return a-b;});
  var median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
  var modal=rows.reduce(function(a,b){return b.f>a.f?b:a;},rows[0]);
  rows.forEach(function(r){r.delta=r.x-mean;r.ad=Math.abs(r.delta)*r.f;r.sq=Math.pow(r.delta,2)*r.f;r.cube=Math.pow(r.delta,3)*r.f;r.fourth=Math.pow(r.delta,4)*r.f;});
  var sum=function(key){return rows.reduce(function(v,r){return v+r[key];},0);};
  var absSum=sum('ad'),squareSum=sum('sq'),varn=squareSum/n,std=Math.sqrt(varn);
  var mu3=sum('cube')/n,mu4=sum('fourth')/n;
  return {n:n,raw:raw,rows:rows,total:total,mean:mean,median:median,mode:modal.x,modeFreq:modal.f,range:rows[rows.length-1].x-rows[0].x,absSum:absSum,absMean:absSum/n,squareSum:squareSum,variance:varn,std:std,cv:std/mean*100,mu3:mu3,mu4:mu4,skew:mu3/Math.pow(std,3),excess:mu4/Math.pow(std,4)-3,sorted:sorted};
}
function rankFmt(x,p){return Number(x).toLocaleString('ru-RU',{minimumFractionDigits:p===undefined?0:p,maximumFractionDigits:p===undefined?0:p});}

    var t=currentTask, mids=t.assumedMidpoints, weights=t.rows.map(function(r){return [r.q1,r.q2];});

    weights.forEach(function(w,i){for(var q=0;q<2;q++){n[q]+=w[q];sum[q]+=mids[i]*w[q];}});

    var std=variance.map(Math.sqrt),cv=std.map(function(s,i){return s/means[i]*100;});
    return {n:n,sum:sum,means:means,dev:dev,sq:sq,mad:mad,variance:variance,std:std,cv:cv,mids:mids,weights:weights,rows:t.rows,assumedBounds:t.assumedBounds};
}

function studyInsertHint(target, text) {
    if (target.dataset.studyReasonAdded === '1') return;
    var hint = document.createElement('details');

    var heading = document.createElement('summary');
    heading.textContent = '💡 Как рассуждать?';
    var body = document.createElement('div');
    body.className = 'study-reason-body';
    body.textContent = text;
    hint.appendChild(heading);
    hint.appendChild(body);
    target.parentNode.insertBefore(hint, target);
    target.dataset.studyReasonAdded = '1';
}

}

function chooseLogicAnswer(checkId, choice) {
    if (!logicState || logicState.finished) return;
    var locked=app.querySelector('.logic-check[data-check-id="'+checkId+'"]');
    if(locked && locked.dataset.statisticsAccepted==='yes')return;
    logicState.answers[checkId] = choice;
    var card = document.querySelector('.logic-check[data-check-id="' + checkId + '"]');
    if (!card) return;
    card.classList.remove('logic-wrong');
    card.querySelectorAll('.logic-choice').forEach(function(button) {
        var chosen = button.getAttribute('data-choice') === choice;
        button.classList.toggle('logic-chosen', chosen);
        button.setAttribute('aria-pressed', chosen ? 'true' : 'false');
    });
    var count = Object.keys(logicState.answers).length;
    document.getElementById('logic-progress').textContent = 'Проверено сочетаний: ' + count + ' / ' + currentTask.checks.length;
    document.getElementById('logic-submit').disabled = count < currentTask.checks.length;
    document.getElementById('logic-feedback').textContent = '';
}

function validateLogicAudit() {
    if (!logicState || logicState.finished) return;
    var answers = logicState.answers;
    var wrong = currentTask.checks.filter(function(item) {
        var good=answers[item.id]===item.expected;
        if(good){var card=app.querySelector('.logic-check[data-check-id="'+item.id+'"]');
           if(card && card.dataset.statisticsAccepted!=='yes'){card.dataset.statisticsAccepted='yes';card.classList.add('statistics-logic-accepted');card.querySelectorAll('.logic-choice').forEach(function(b){b.disabled=true;});var badge=document.createElement('span');badge.className='statistics-accepted-label';badge.textContent='✓ Ответ принят';card.appendChild(badge);}
        }
        return !good;
    });
    logicState.attempts++;
    app.querySelectorAll('.logic-check').forEach(function(card) {
        card.classList.remove('logic-wrong');
    });
    var feedback = document.getElementById('logic-feedback');
    if (wrong.length) {
        wrong.forEach(function(item) {
            var card = app.querySelector('.logic-check[data-check-id="' + item.id + '"]');
            if (card) card.classList.add('logic-wrong');
        });
        playSound('error');
        feedback.className = 'logic-feedback logic-feedback-error';
        feedback.textContent = 'Засчитано '+(currentTask.checks.length-wrong.length)+' из '+currentTask.checks.length+'. Исправь только красные карточки.';
        document.getElementById('logic-submit').textContent = 'ПРОВЕРИТЬ СНОВА';
        return;
    }
    logicState.finished = true;
    playSound('success');
    app.querySelectorAll('.logic-choice').forEach(function(button) {button.disabled = true;});
    var submit = document.getElementById('logic-submit');
    submit.textContent = 'ПРОВЕРЕНО · ВСЕ СОЧЕТАНИЯ ВЕРНЫ';
    submit.disabled = true;
    feedback.className = 'logic-feedback logic-feedback-success';
    feedback.textContent = 'Отлично! Теперь разберём, почему некоторые записи требуют уточнения.';
    renderLogicGuideStep();
    focusLogicGuideStep();
}

function renderLogicGuideStep() {
    if (!logicState || !logicState.finished) return;
    var steps = currentTask.guideSteps;
    var index = logicState.current;
    var step = steps[index];
    var opened = !!logicState.opened[index];
    var progress = steps.map(function(_, i) {
        return '<span class="logic-step-track' + (i <= index ? ' active' : '') + '"></span>';
    }).join('');
    var html = '<section class="logic-walkthrough" aria-label="Пошаговое объяснение">'
        + '<div class="logic-guide-top"><span>РАЗБОР</span><span>Шаг ' + (index+1) + ' из ' + steps.length + '</span></div>'
        + '<div class="logic-step-progress">' + progress + '</div>'
        + '<div class="logic-step-intro"><h2 id="logic-step-title" tabindex="-1">' + step.title + '</h2><p>' + step.question + '</p></div>';
    if (opened) {
        html += '<div class="logic-step-details">' + step.body + '</div>';
    } else {
        html += '<p class="logic-step-think">Сначала сформулируйте своё объяснение, затем откройте разбор.</p>'
            + '<button type="button" class="logic-reveal" onclick="revealLogicStep()">Показать объяснение</button>';
    }
    html += '<div class="logic-step-actions">'
        + '<button type="button" onclick="moveLogicStep(-1)" ' + (index===0 ? 'disabled' : '') + '>← Назад</button>'
        + '<button type="button" class="logic-next" onclick="moveLogicStep(1)" ' + (!opened ? 'disabled' : '') + '>'
        + (index===steps.length-1 ? 'Завершить разбор ✓' : 'Следующий шаг →') + '</button></div></section>';
    document.getElementById('logic-guide-area').innerHTML = html;
}

function focusLogicGuideStep() {
    var title = document.getElementById('logic-step-title');
    if (!title) return;
    try { title.focus({preventScroll:true}); } catch(e) { title.focus(); }
    var panel = document.querySelector('.logic-walkthrough');
    if (panel) panel.scrollIntoView({block:'start', behavior:'auto'});
}
function revealLogicStep() {
    if (!logicState || !logicState.finished) return;
    logicState.opened[logicState.current] = true;
    renderLogicGuideStep();
    focusLogicGuideStep();
}
function moveLogicStep(direction) {
    if (!logicState || !logicState.finished) return;
    if (direction > 0 && !logicState.opened[logicState.current]) return;
    var next = logicState.current + direction;
    if (next < 0) return;
    if (next >= currentTask.guideSteps.length) {
        var area = document.getElementById('logic-guide-area');
        area.innerHTML = '<section class="logic-completed"><h2>🎓 Разбор завершён!</h2><p>Вы нашли все противоречия и объяснили, почему записи требуют проверки.</p><button type="button" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">К списку задач</button></section>';
        // Салют за освоение решения независимо от числа пробных попыток.
        statisticsCelebrateOnce();
        return;
    }
    logicState.current = next;
    renderLogicGuideStep();
    focusLogicGuideStep();
}

// Прямой выбор задания без случайного поиска нужной задачи.
function showTopicTasks(topicId) {
    var tasks = statisticsTasks.filter(function(t) {return t.topicId === topicId;});
    if (!tasks.length) {renderScreen('topics',{mode:'tasks'});return;}
    var title = htmlEscape(tasks[0].topicName);
    var markup = '<div class="topic-task-chooser"><h1>' + title + '</h1>'
        + '<p class="subtitle">Выберите конкретное задание или случайную задачу этой темы.</p>'
        + '<div class="topic-task-list">';
    tasks.forEach(function(task) {
        var state = task.status === 'draft' ? '<span class="topic-task-draft">Черновик · не проверен</span>'
            : (task.status === 'testing' ? '<span class="topic-task-testing">Тестовая версия</span>' : '');
        // Короткую предметную пометку показываем отдельной строкой,
        // сохраняя оригинальный заголовок и данные задачи неизменными.
        var label = task.title;
        var caption = '';
        markup += '<button type="button" class="topic-task-select" onclick="selectTaskById(\'' + task.id + '\')">'
            + '<span class="topic-task-title">' + htmlEscape(label) + '</span>' + caption + state + '</button>';
    });
    markup += '</div><button type="button" class="topic-task-random" onclick="selectTopic(\'' + topicId + '\')">🎲 Случайная задача темы</button>'
        + '<button type="button" class="topic-task-return" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">← К темам</button></div>';
    app.innerHTML = markup;
}
function selectTaskById(id) {
    var task = statisticsTasks.find(function(t) {return t.id === id;});
    if (!task) return;
    currentTask = task;
    taskVars = {};
    assignedVars = {};
    renderScreen('task');
}

// Present one row per ticket type on narrow screens without changing any task data.
function prepareIndexTable() {
    var table = app.querySelector('.task-table-wrap table');
    if (!table || !table.rows.length) return;
    table.classList.add('index-task-table');
    var headings = Array.prototype.map.call(table.rows[0].cells, function(cell) {
        return (cell.innerHTML || '').replace(/<br\s*\/?\s*>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    });
    for (var i = 1; i < table.rows.length; i++) {
        for (var j = 1; j < table.rows[i].cells.length; j++) {
            table.rows[i].cells[j].setAttribute('data-label', headings[j] || 'Значение');
        }
    }
}

// Единая визуальная легенда для всех индексных задач.
// Цвет следует типу статистической переменной, а не конкретной ячейке.
// Исходные данные и расчётные функции из data-statistics-tasks.js не изменяются.
var indexVariablePalette = {
    p0: '#fbbf24',   // базисная цена — золото
    q0: '#4ade80',   // базисное количество — зелёный
    p0q0: '#fb923c', // базисная выручка — оранжевый
    p1: '#38bdf8',   // восстановленная цена — голубой
    q1: '#c084fc',   // отчётное количество — фиолетовый
    p1q1: '#fb923c' // отчётная выручка — оранжевый
};
var indexVariableNames = {
    p0: 'p₀', q0: 'q₀', p0q0: 'p₀q₀',
    p1: 'p₁', q1: 'q₁', p1q1: 'p₁q₁'
};
function indexVariableColor(type) {
    return indexVariablePalette[type] || (currentTask.colors && currentTask.colors[type]) || '#38bdf8';
}
function prepareIndexValues() {
    var cells = app.querySelectorAll('.index-task-table .var');
    cells.forEach(function(cell) {
        cell.classList.add('index-pending');
        cell.classList.remove('index-assigned', 'index-error');
        cell.innerHTML = '<span class="index-value-text">' + cell.getAttribute('data-val') + '</span>';
        cell.setAttribute('title', 'Нажмите, чтобы определить переменную');
        cell.setAttribute('aria-pressed', 'false');
    });
}
function showIndexAssignedValue(cell, type) {
    var color = indexVariableColor(type);
    var label = indexVariableNames[type] || type;
    // В «Дано» остаются исходные единицы (например, 520 тыс. руб.),
    // а перевод в рубли происходит в шаге вычисления.
    var value = cell.getAttribute('data-val');
    cell.innerHTML = '<span class="index-typed-value">' + label + ' = ' + value + '</span>';
    cell.classList.add('index-assigned');
    cell.classList.remove('index-pending', 'index-error');
    cell.style.setProperty('--index-assignment-color', color);
    cell.style.color = color;
    cell.style.backgroundColor = color + '24';
    cell.style.textDecoration = 'none';
    cell.style.borderRadius = '4px';
    cell.style.border = '1px solid ' + color;
    cell.setAttribute('title', 'Нажмите, чтобы изменить назначение');
    cell.setAttribute('aria-label', 'Назначено ' + label + ', значение ' + value + '. Нажмите для изменения');
    cell.setAttribute('aria-pressed', 'true');
}
function showIndexUnassignedValue(cell) {
    var value = cell.getAttribute('data-val');
    cell.innerHTML = '<span class="index-value-text">' + value + '</span>';
    cell.classList.add('index-pending');
    cell.classList.remove('index-assigned', 'index-error');
    cell.style.removeProperty('--index-assignment-color');
    cell.style.color = '#38bdf8';
    cell.style.backgroundColor = 'transparent';
    cell.style.textDecoration = 'none';
    cell.style.borderRadius = '';
    cell.style.border = '';
    cell.setAttribute('title', 'Нажмите, чтобы определить переменную');
    cell.setAttribute('aria-label', 'Определить переменную для значения ' + value);
    cell.setAttribute('aria-pressed', 'false');
}

// --- УНИВЕРСАЛЬНОЕ МЕНЮ ВЫБОРА ПЕРЕМЕННЫХ ---
function showVarMenu(cell) {
    if (isSolved || cell.dataset.statisticsAccepted==='yes') return;
    activeCell = cell;
    var menu = document.getElementById('varMenu');
    var rect = cell.getBoundingClientRect();
    menu.style.left = (rect.left + window.scrollX) + 'px';
    menu.style.top = (rect.bottom + window.scrollY + 5) + 'px';

    var options = currentTask.menuOptions || {
        'p0': 'p₀ (Цена базис)',
        'q0': 'q₀ (Кол-во базис)',
        'p0q0': 'p₀q₀ (Выручка базис)',
        'p1': 'p₁ (Цена отчёт)',
        'q1': 'q₁ (Кол-во отчёт)',
        'p1q1': 'p₁q₁ (Выручка отчёт)'
    };

    var html = '';
    for (var key in options) {
        if (currentTask.colors[key]) {
            var choiceColor = currentTask.type === 'index_table' ? indexVariableColor(key) : currentTask.colors[key];
            html += '<div style="color:' + choiceColor + '; padding:10px; cursor:pointer; font-weight:bold; border-bottom:1px solid #4a5568;" onclick="assignVar(\'' + key + '\')">' + options[key] + '</div>';
        }
    }
    html += '<div style="color:#fc8181; padding:10px; cursor:pointer; font-weight:bold;" onclick="clearVar()">Очистить</div>';
    menu.innerHTML = html;
    menu.style.display = 'block';
    if (window.innerWidth > 640) {
        var width = menu.offsetWidth || 260;
        var left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
        menu.style.left = (left + window.scrollX) + 'px';
        var height = menu.offsetHeight || 300;
        if (rect.bottom + height > window.innerHeight) {
            menu.style.top = Math.max(12, rect.top - height + window.scrollY - 5) + 'px';
        }
    }
}

function assignVar(type) {
    if (!activeCell || isSolved || activeCell.dataset.statisticsAccepted==='yes') return;

    var fullVar = activeCell.getAttribute('data-var');

    assignedVars[fullVar] = type;
    taskVars[fullVar] = parseFloat(activeCell.getAttribute('data-val'));

    if (currentTask.type === 'index_table') {
        showIndexAssignedValue(activeCell, type);
    } else {
        var val = activeCell.getAttribute('data-val');
        if ((type === 'p1q1' || type === 'p0q0') && val < 1000) val = val * 1000;
        activeCell.innerHTML = type + ' = ' + val;
        activeCell.style.color = currentTask.colors[type];
        activeCell.style.backgroundColor = currentTask.colors[type] + '33';
        activeCell.style.textDecoration = 'none';
        activeCell.style.borderRadius = '4px';
        activeCell.style.border = '1px solid ' + currentTask.colors[type];
    }

    playSound('success');
    document.getElementById('varMenu').style.display = 'none';
    checkReady();
}

function clearVar() {
    if (!activeCell || isSolved || activeCell.dataset.statisticsAccepted==='yes') return;
    var fullVar = activeCell.getAttribute('data-var');
    delete assignedVars[fullVar];
    delete taskVars[fullVar];

    if (currentTask.type === 'index_table') {
        showIndexUnassignedValue(activeCell);
    } else {
        activeCell.innerHTML = activeCell.getAttribute('data-val');
        activeCell.style.color = '#63b3ed';
        activeCell.style.backgroundColor = 'transparent';
        activeCell.style.textDecoration = 'underline';
        activeCell.style.borderRadius = '0';
        activeCell.style.border = 'none';
    }

    document.getElementById('varMenu').style.display = 'none';
    checkReady();
}

function checkReady() {
    var count = Object.keys(assignedVars).length;
    document.getElementById('varCounter').innerText = count;
    var btn = document.getElementById('solve-btn');

    if (count === currentTask.requiredVars.length) {
        btn.style.background = '#3b82f6';
        btn.style.color = 'white';
        btn.style.cursor = 'pointer';
        btn.disabled = false;
        btn.innerText = "ПРОВЕРИТЬ И РЕШИТЬ";
    } else {
        btn.style.background = '#4a5568';
        btn.style.color = '#718096';
        btn.style.cursor = 'not-allowed';
        btn.disabled = true;
    }
}


// --- ПОШАГОВЫЙ РАЗБОР ДВУХ МУЗЕЙНЫХ ЗАДАЧ (1.1 и 1.2) ---
// Существующие условие, проверка переменных и currentTask.solve() не меняются.
// Общие кнопки, подсветка и навигация используются из работающего разбора 1.3.
function createMuseumGuide(v, conclusion) {
    var isSecond = currentTask.id === 'task_1_2';
    function fmt(x) { return new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2}).format(x); }
    function rub(x) { return fmt(x) + ' руб.'; }
    function pct(x) { return fmt(x * 100) + '%'; }
    function source(type, val) {
        return '<span class="index-source index-source-' + type + '">' + fmt(val) + '</span>';
    }
    function equation(expression, result) {
        return '<p class="index-calculation">' + expression + ' = <strong>' + result + '</strong></p>';
    }
    var names = ['Взрослые', 'Льготные', 'Детские'];
    var p0 = [v.p0_1, v.p0_2, v.p0_3];
    var p1 = [v.p1_1, v.p1_2, v.p1_3];
    var q1 = [v.q1_1, v.q1_2, v.q1_3];
    var q0 = isSecond
        ? [v.p0q0_1, v.p0q0_2, v.p0q0_3].map(function(r,i){return r*1000/p0[i];})
        : [v.q0_1,v.q0_2,v.q0_3];
    var base = p0.reduce(function(s,p,i){return s+p*q0[i];},0);
    var actual = p1.reduce(function(s,p,i){return s+p*q1[i];},0);
    var conditional = p0.reduce(function(s,p,i){return s+p*q1[i];},0);
    var total = actual-base, price = actual-conditional, quantity = conditional-base;
    var row = function(prices,amounts,priceType,amountType) {
        return prices.map(function(p,i){return source(priceType,p)+' × '+source(amountType,amounts[i]);}).join(' + ');
    };
    var recover = q0.map(function(n,i){
        return equation(names[i]+': '+source('p0q0',v['p0q0_'+(i+1)])+' × 1 000 / '+source('p0',p0[i]),fmt(n)+' шт.');
    }).join('');
    var stages = [];
    if (isSecond) {
        stages.push({
            title:'Восстанавливаем январское количество билетов (q₀)',
            question:'Известны январская цена и выручка в тысячах рублей. Как получить число билетов?',
            body:'<p><strong>Формула:</strong> q₀ = R₀ / p₀. Сначала переводим выручку из тыс. руб. в рубли.</p>'
                + recover
                + '<p class="index-step-note">Проверка: количество × цена возвращает исходную январскую выручку.</p>'
        });
    } else {
        stages.push({
            title:'Разбираемся в обозначениях и периодах',
            question:'Какие из четырёх столбцов обозначают цены, а какие — число билетов? Что значит индекс 0 или 1?',
            body:'<p><strong>p</strong> — цена одного билета, <strong>q</strong> — количество проданных билетов. Индекс 0 — январь, индекс 1 — март.</p>'
                + '<p class="index-step-note">Чтобы получить выручку по каждой категории, умножаем цену на количество билетов за один и тот же месяц.</p>'
                + equation(source('p0',p0[0])+' × '+source('q0',q0[0]),rub(p0[0]*q0[0]))
                + equation(source('p1',p1[0])+' × '+source('q1',q1[0]),rub(p1[0]*q1[0]))
        });
    }
    stages.push({
        title:'Находим три совокупные суммы',
        question:'Зачем, кроме фактических январской и мартовской выручек, нужна условная сумма при январских ценах?',
        body:'<p><strong>Январь, Σ(p₀q₀):</strong></p>'
            + (isSecond
                ? equation([v.p0q0_1,v.p0q0_2,v.p0q0_3].map(function(n){return '('+source('p0q0',n)+' × 1 000)';}).join(' + '),rub(base))
                : equation(row(p0,q0,'p0','q0'),rub(base)))
            + '<p><strong>Март, Σ(p₁q₁):</strong></p>'
            + equation(row(p1,q1,'p1','q1'),rub(actual))
            + '<p><strong>Условная сумма, Σ(p₀q₁):</strong></p>'
            + equation(row(p0,q1,'p0','q1'),rub(conditional))
            + '<p class="index-step-note">Условная выручка — сколько музей получил бы за мартовские билеты по январским ценам. Она отделяет эффект изменения числа билетов от эффекта цен.</p>'
    });
    stages.push({
        title:'Вычисляем индексы выручки, цен и количества',
        question:'Какие суммы должны стоять в числителе и знаменателе каждого индекса?',
        body:'<p><strong>Индекс выручки:</strong> Iₚq = Σ(p₁q₁) / Σ(p₀q₀)</p>'
            + equation(fmt(actual)+' / '+fmt(base)+' × 100',pct(actual/base))
            + '<p><strong>Индекс цен:</strong> Iₚ = Σ(p₁q₁) / Σ(p₀q₁)</p>'
            + equation(fmt(actual)+' / '+fmt(conditional)+' × 100',pct(actual/conditional))
            + '<p><strong>Индекс количества:</strong> Iq = Σ(p₀q₁) / Σ(p₀q₀)</p>'
            + equation(fmt(conditional)+' / '+fmt(base)+' × 100',pct(conditional/base))
            + '<p class="index-step-note">Проверка: Iₚ × Iq = Iₚq (в коэффициентах). Значения свыше 100% означают рост, ниже 100% — снижение.</p>'
    });
    stages.push({
        title:'Отделяем влияние цен от влияния количества',
        question:'Как разложить общий прирост выручки на два фактора и проверить результат?',
        body:'<p><strong>Общее изменение:</strong> ΔR = Σ(p₁q₁) − Σ(p₀q₀)</p>'
            + equation(fmt(actual)+' − '+fmt(base),rub(total))
            + '<p><strong>Изменение за счёт цен:</strong> ΔP = Σ(p₁q₁) − Σ(p₀q₁)</p>'
            + equation(fmt(actual)+' − '+fmt(conditional),rub(price))
            + '<p><strong>Изменение за счёт количества:</strong> ΔQ = Σ(p₀q₁) − Σ(p₀q₀)</p>'
            + equation(fmt(conditional)+' − '+fmt(base),rub(quantity))
            + '<p class="index-step-note"><strong>Самопроверка:</strong> '+fmt(price)+' + ('+fmt(quantity)+') = '+rub(total)+'.</p>'
    });
    stages.push({
        title:'Объясняем результат музею',
        question:'Что произошло с выручкой, как повлияли цены и количество проданных билетов?',
        body:'<p>'+htmlEscape(conclusion)+'</p>'
            + '<p class="index-step-note">Итоговый индекс выручки: <strong>'+pct(actual/base)+'</strong>. Абсолютное изменение: <strong>'+rub(total)+'</strong>, в том числе за счёт цен — <strong>'+rub(price)+'</strong>, за счёт количества — <strong>'+rub(quantity)+'</strong>.</p>'
            + '<p>Прирост выручки и прирост посещаемости — разные показатели. Даже если билетов продали меньше, повышение цены способно увеличить общую выручку.</p>'
    });
    return {steps:stages,current:0,opened:{}};
}

// --- ПОШАГОВОЕ ОБЪЯСНЕНИЕ: ТЕАТР (task_1_3) ---
// Данные и исходная функция currentTask.solve() остаются без изменений.
// Здесь вычисляются только значения, необходимые для отображения каждого шага.
function createTheatreGuide(v, conclusion) {
    function fmt(value) {
        return new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 1}).format(value);
    }
    function money(value) { return fmt(value) + ' руб.'; }
    function pct(value) { return fmt(value * 100) + '%'; }
    var p0 = [v.p0_1, v.p0_2, v.p0_3];
    var q0 = [v.q0_1, v.q0_2, v.q0_3];
    var q1 = [v.q1_1, v.q1_2, v.q1_3];
    var revenueThousands = [v.p1q1_1, v.p1q1_2, v.p1q1_3];
    var p1 = revenueThousands.map(function(revenue, i) { return revenue * 1000 / q1[i]; });
    var sumP0Q0 = p0.reduce(function(s, price, i) { return s + price * q0[i]; }, 0);
    var sumP1Q1 = revenueThousands.reduce(function(s, revenue) { return s + revenue * 1000; }, 0);
    var sumP0Q1 = p0.reduce(function(s, price, i) { return s + price * q1[i]; }, 0);
    var deltaRevenue = sumP1Q1 - sumP0Q0;
    var deltaPrice = sumP1Q1 - sumP0Q1;
    var deltaQuantity = sumP0Q1 - sumP0Q0;
    var names = ['Взрослый билет', 'Льготный билет', 'Детский билет'];

    var recoveredPrices = p1.map(function(price, i) {
        return '<p><strong>' + names[i] + ':</strong> '
            + '<span class="index-orange">' + fmt(revenueThousands[i]) + '</span> × 1 000'
            + ' / <span class="index-purple">' + fmt(q1[i]) + '</span>'
            + ' = <strong class="index-sky">' + money(price) + '</strong></p>';
    }).join('');

    function markSource(type, value) {
        // Цвет используется только для исходных чисел, взятых из «Дано».
        return '<span class="index-source index-source-' + type + '">' + fmt(value) + '</span>';
    }
    var febItems = p0.map(function(price, i) {
        return markSource('p0', price) + ' × ' + markSource('q0', q0[i]);
    }).join(' + ');
    var aprItems = revenueThousands.map(function(n) {
        return '(' + markSource('p1q1', n) + ' × 1 000)';
    }).join(' + ');
    var conditionalItems = p0.map(function(price, i) {
        return markSource('p0', price) + ' × ' + markSource('q1', q1[i]);
    }).join(' + ');

    var steps = [
        {
            title: 'Определяем цены апреля (p₁)',
            question: 'Мы знаем апрельскую выручку и количество проданных билетов. Как найти цену одного билета?',
            body: '<p><strong>Формула:</strong> p₁ = (p₁q₁) / q₁</p>'
                + '<p class="index-step-note">Сначала переводим апрельскую выручку из тысяч рублей в рубли: умножаем каждое число на 1000.</p>'
                + recoveredPrices
                + '<p class="index-step-note">Теперь известны цены всех трёх видов билетов за оба периода.</p>'
        },
        {
            title: 'Рассчитываем три совокупные суммы',
            question: 'Какие суммы позволяют отделить изменение цен от изменения количества проданных билетов?',
            body: '<p><strong>Февральская выручка:</strong> Σ(p₀q₀)</p>'
                + '<p class="index-calculation">' + febItems + ' = <strong>' + money(sumP0Q0) + '</strong></p>'
                + '<p><strong>Апрельская выручка:</strong> Σ(p₁q₁)</p>'
                + '<p class="index-calculation">' + aprItems + ' = <strong>' + money(sumP1Q1) + '</strong></p>'
                + '<p><strong>Условная выручка:</strong> Σ(p₀q₁)</p>'
                + '<p class="index-calculation">' + conditionalItems + ' = <strong>' + money(sumP0Q1) + '</strong></p>'
                + '<p class="index-step-note">Условная сумма показывает, сколько театр получил бы за апрельские билеты при февральских ценах.</p>'
        },
        {
            title: 'Вычисляем индексы',
            question: 'Как изменилась общая выручка? Что произошло бы при неизменных ценах или объёме продаж?',
            body: '<p><strong>Индекс выручки:</strong> Iₚq = Σ(p₁q₁) / Σ(p₀q₀)</p>'
                + '<p class="index-calculation">' + fmt(sumP1Q1) + ' / ' + fmt(sumP0Q0) + ' × 100 = <strong>' + pct(sumP1Q1 / sumP0Q0) + '</strong></p>'
                + '<p><strong>Индекс цен:</strong> Iₚ = Σ(p₁q₁) / Σ(p₀q₁)</p>'
                + '<p class="index-calculation">' + fmt(sumP1Q1) + ' / ' + fmt(sumP0Q1) + ' × 100 = <strong>' + pct(sumP1Q1 / sumP0Q1) + '</strong></p>'
                + '<p><strong>Индекс физического объёма:</strong> Iq = Σ(p₀q₁) / Σ(p₀q₀)</p>'
                + '<p class="index-calculation">' + fmt(sumP0Q1) + ' / ' + fmt(sumP0Q0) + ' × 100 = <strong>' + pct(sumP0Q1 / sumP0Q0) + '</strong></p>'
                + '<p class="index-step-note">Индекс ниже 100% означает снижение соответствующего показателя; выше 100% — его увеличение.</p>'
        },
        {
            title: 'Разделяем влияние факторов',
            question: 'Какую часть изменения выручки объясняют цены, а какую — количество билетов?',
            body: '<p><strong>Общее изменение:</strong> ΔR = Σ(p₁q₁) − Σ(p₀q₀)</p>'
                + '<p class="index-calculation">' + fmt(sumP1Q1) + ' − ' + fmt(sumP0Q0) + ' = <strong>' + money(deltaRevenue) + '</strong></p>'
                + '<p><strong>Влияние цен:</strong> ΔP = Σ(p₁q₁) − Σ(p₀q₁)</p>'
                + '<p class="index-calculation">' + fmt(sumP1Q1) + ' − ' + fmt(sumP0Q1) + ' = <strong>' + money(deltaPrice) + '</strong></p>'
                + '<p><strong>Влияние количества:</strong> ΔQ = Σ(p₀q₁) − Σ(p₀q₀)</p>'
                + '<p class="index-calculation">' + fmt(sumP0Q1) + ' − ' + fmt(sumP0Q0) + ' = <strong>' + money(deltaQuantity) + '</strong></p>'
                + '<p class="index-step-note"><strong>Самопроверка:</strong> ' + fmt(deltaPrice) + ' + ' + fmt(deltaQuantity) + ' = ' + money(deltaRevenue) + '. Сумма факторов равна общему изменению.</p>'
        },
        {
            title: 'Формулируем итоговый вывод',
            question: 'Как объяснить директору театра, почему изменилась выручка?',
            body: '<p>' + conclusion + '</p>'
                + '<p class="index-step-note">Общий индекс выручки: <strong>' + pct(sumP1Q1 / sumP0Q0)
                + '</strong>. Выручка изменилась на <strong>' + money(deltaRevenue)
                + '</strong>: влияние цен — <strong>' + money(deltaPrice)
                + '</strong>, влияние количества — <strong>' + money(deltaQuantity) + '</strong>.</p>'
        }
    ];
    return {steps: steps, current: 0, opened: {}};
}

function renderTheatreGuideStep() {
    if (!theatreGuide) return;
    var guide = theatreGuide;
    var index = guide.current;
    var step = guide.steps[index];
    var opened = !!guide.opened[index];
    var area = document.getElementById('solution-area');
    if (!area) return;

    var progress = guide.steps.map(function(_, i) {
        return '<span class="index-step-track' + (i <= index ? ' active' : '') + '"></span>';
    }).join('');

    var html = '<section class="index-walkthrough" aria-label="Пошаговое решение">'
        + '<div class="index-guide-top"><span class="index-guide-label">РАЗБОР ЗАДАЧИ</span>'
        + '<span class="index-step-counter">Шаг ' + (index + 1) + ' из ' + guide.steps.length + '</span></div>'
        + '<div class="index-step-progress" role="progressbar" aria-label="Этапы решения" aria-valuemin="1" aria-valuemax="5" aria-valuenow="' + (index + 1) + '">' + progress + '</div>'
        + '<div class="index-step-intro"><h2 id="index-step-title" tabindex="-1">' + step.title + '</h2><p>' + step.question + '</p></div>';
    if (opened) {
        html += '<div class="index-step-details" aria-label="Расчёт и пояснение">' + step.body + '</div>';
    } else {
        html += '<p class="index-step-think">Попробуйте мысленно выполнить этот этап, затем откройте расчёт.</p>'
            + '<button type="button" class="index-guide-reveal" onclick="revealTheatreStep()">Показать расчёт и объяснение</button>';
    }
    html += '<div class="index-guide-actions">'
        + '<button type="button" class="index-guide-back" onclick="moveTheatreStep(-1)" ' + (index === 0 ? 'disabled' : '') + '>← Назад</button>'
        + '<button type="button" class="index-guide-next" onclick="moveTheatreStep(1)" ' + (!opened ? 'disabled' : '') + '>'
        + (index === guide.steps.length - 1 ? 'Повторить разбор ↺' : 'Следующий шаг →') + '</button>'
        + '</div></section>';
    area.innerHTML = html;
}

function focusTheatreGuideStep() {
    var title = document.getElementById('index-step-title');
    if (!title) return;
    try { title.focus({preventScroll: true}); } catch(e) { title.focus(); }
    var guide = document.querySelector('.index-walkthrough');
    if (guide) guide.scrollIntoView({block:'start',behavior: 'auto'});
}

function revealTheatreStep() {
    if (!theatreGuide) return;
    theatreGuide.opened[theatreGuide.current] = true;
    if(theatreGuide.current===theatreGuide.steps.length-1) statisticsCelebrateOnce();
    renderTheatreGuideStep();
    focusTheatreGuideStep();
}

function moveTheatreStep(direction) {
    if (!theatreGuide) return;
    if (direction > 0 && !theatreGuide.opened[theatreGuide.current]) return;
    var next = theatreGuide.current + direction;
    if (next >= theatreGuide.steps.length) {
        theatreGuide.current = 0;
        theatreGuide.opened = {};
    } else if (next >= 0) {
        theatreGuide.current = next;
    } else return;
    renderTheatreGuideStep();
    focusTheatreGuideStep();
}

// Приводим только ОТОБРАЖЕНИЕ старых музейных решений к общей палитре.

function recolorMuseumSolution(html) {
    if (!html || (currentTask.id !== 'task_1_1' && currentTask.id !== 'task_1_2')) return html;
    return html
        .replace(/color:#60a5fa/gi, 'color:__BASE_PRICE__')

        .replace(/color:__BASE_PRICE__/g, 'color:#fbbf24'); // p₀
}

function validateAndSolve() {
    if (isSolved) return;

    var errors = [];
    var allCells = document.querySelectorAll('.var');

    allCells.forEach(function(cell) {
        var fVar = cell.getAttribute('data-var');
        if (assignedVars[fVar]) {
             var assignedColor = currentTask.type === 'index_table' ? indexVariableColor(assignedVars[fVar]) : currentTask.colors[assignedVars[fVar]];
             cell.classList.remove('index-error');
             cell.style.backgroundColor = assignedColor + '24';
             cell.style.border = '1px solid ' + assignedColor;
             cell.style.color = assignedColor;
        }
    });

    for (var fullVar in assignedVars) {
        var chosenType = assignedVars[fullVar];
        var expectedType = fullVar.split('_')[0];

        if (chosenType === expectedType) {
            var acceptedCell=document.querySelector('.var[data-var="'+fullVar+'"]');
            if(acceptedCell){acceptedCell.dataset.statisticsAccepted='yes';acceptedCell.classList.add('index-cell-accepted');acceptedCell.setAttribute('title','✓ Ответ принят');acceptedCell.setAttribute('aria-label','Ответ принят: '+acceptedCell.getAttribute('data-val'));acceptedCell.setAttribute('aria-disabled','true');}
        } else {
            errors.push(fullVar);
            var cell = document.querySelector('.var[data-var="' + fullVar + '"]');
            if (cell) {
                cell.classList.add('index-error');
                cell.style.backgroundColor = '#ef4444';
                cell.style.border = '2px solid #b91c1c';
                cell.style.color = '#fff';
            }
        }
    }

    var solutionArea = document.getElementById('solution-area');
    var btn = document.getElementById('solve-btn');

    if (errors.length > 0) {
        solutionArea.classList.add('has-error');
        playSound('error');
        solutionArea.innerHTML = `
            <div style="background:#2d3748; border:1px solid #ef4444; border-radius:8px; padding:20px; margin-top:20px; text-align:center;">
                <h4 style="color:#ef4444; margin-top:0;">⚠️ Найдены ошибки!</h4>
                <p style="color:#fff;">Засчитано <b>${Object.keys(assignedVars).length-errors.length} из ${Object.keys(assignedVars).length}</b> переменных. Исправь только <b>${errors.length}</b> красных значений.</p>
                <p style="color:#a0aec0; font-size:14px;">Исправьте их и нажмите кнопку снова.</p>
            </div>
        `;
        btn.style.background = '#3b82f6';
        btn.innerText = "ПРОВЕРИТЬ СНОВА";

    } else {
        solutionArea.classList.remove('has-error');
        isSolved = true;
        playSound('success');

        var result = currentTask.solve(taskVars);
        if (currentTask.type === 'index_table' && ['task_1_1','task_1_2','task_1_3'].indexOf(currentTask.id) !== -1) {
            // Новая презентация на 5 этапов; исходный solve() продолжает выполняться.
            theatreGuide = currentTask.id === 'task_1_3' ? createTheatreGuide(taskVars, result.conclusion) : createMuseumGuide(taskVars, result.conclusion);
            renderTheatreGuideStep();
            focusTheatreGuideStep();
        } else {
            // Для остальных заданий сохраняем прежний способ показа решений.
            if(currentTask.type==='index_table') statisticsCelebrateOnce();
            var html = currentTask.type === 'index_table' ? recolorMuseumSolution(result.calc) : result.calc;
            html += '<div style="background:#2d3748; border:1px solid #ecc94b; border-radius:8px; padding:20px; margin-top:20px;"><h4 style="color:#ecc94b; margin-top:0;">✅ Вывод:</h4><p style="color:#fff; line-height:1.5;">' + result.conclusion + '</p></div>';
            html += '<button class="btn btn-orange" onclick="startRandomTask(this)" style="width:100%; margin-top:20px;">СЛЕДУЮЩАЯ ЗАДАЧА</button>';
            solutionArea.innerHTML = html;
        }

        btn.style.background = '#48bb78';
        btn.style.color = 'white';
        btn.innerText = "РЕШЕНО ВЕРНО";
        btn.disabled = true;
        btn.style.cursor = 'default';
    }
}

function dynFmt(n,d){return Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});}
function dynData(){
