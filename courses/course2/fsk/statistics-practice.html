// Засчитываем каждый правильный выбор независимо от соседних вопросов.
// Этот общий механизм используется в задачах 7.1, 7.2 и 8.1.
function dynLockCorrectAnswers(prefix,stage,answers){
    var keys=Object.keys(answers),accepted=0;
    keys.forEach(function(key){
        var select=document.getElementById(prefix+'-'+stage+key);
        if(!select)return;
        var label=select.closest('.dyn-select');
        var valid=select.dataset.answerAccepted==='yes'||select.value===answers[key];
        if(valid){
            select.dataset.answerAccepted='yes';
            select.disabled=true;
            select.classList.remove('dyn-invalid');
            select.classList.add('dyn-accepted');
            if(label&&!label.querySelector('.dyn-accepted-note')){
                var note=document.createElement('span');
                note.className='dyn-accepted-note';
                note.textContent='✓ Ответ принят';
                label.appendChild(note);
            }
            accepted++;
        }else{
            select.classList.toggle('dyn-invalid',!!select.value);
        }
    });
    var all=accepted===keys.length;
    var feedback=document.getElementById(prefix+'-feedback-'+stage);
    if(feedback){
        feedback.className='dyn-feedback '+(all?'dyn-good':accepted?'dyn-partial':'dyn-bad');
        feedback.textContent=all?'✅ Все '+keys.length+' ответа засчитаны! Показываем расчёты.':accepted?'✅ '+accepted+' из '+keys.length+' ответов засчитаны и сохранены. Исправь только оставшиеся — принятые варианты больше не проверяются.':'Пока нет правильных ответов. Проверь выделенные варианты и открой «Как рассуждать?». ';
    }
    return all;
}

function dynChart(v){
    var W=660,H=250,L=42,R=15,T=18,B=43,min=150,max=220;
    function xx(i){return L+(W-L-R)*i/(v.rows.length-1);}
    function yy(val){return H-B-(H-T-B)*(val-min)/(max-min);}
    var path=v.rows.map(function(r,i){return (i?'L':'M')+xx(i).toFixed(2)+','+yy(r.cost).toFixed(2);}).join(' ');
    var grid=[160,180,200,220].map(function(y){return '<line class="dyn-gridline" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy(y)+'" y2="'+yy(y)+'"/><text class="dyn-axis" x="'+(L-9)+'" y="'+(yy(y)+5)+'" text-anchor="end">'+y+'</text>';}).join('');
    var labels=[0,3,6,9,12,15].map(function(i){return '<text class="dyn-axis" x="'+xx(i)+'" y="'+(H-13)+'" text-anchor="middle">'+v.rows[i].year+'</text>';}).join('');
    var dots=v.rows.map(function(r,i){return '<circle class="dyn-point'+(i===0?' dyn-first':i===v.rows.length-1?' dyn-last':'')+'" cx="'+xx(i)+'" cy="'+yy(r.cost)+'" r="'+(i===0||i===v.rows.length-1?5.8:3.7)+'"><title>'+r.year+': '+r.cost+' тыс. руб.</title></circle>';}).join('');
    return '<div class="dyn-chart-container" role="img" aria-label="Линейный график затрат на подготовку специалиста по годам, от 162 тысяч рублей в 2008 году до 210 тысяч рублей в 2023 году; график содержит промежуточные колебания."><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'+grid+'<path d="'+path+'" class="dyn-line"/>'+dots+labels+'</svg></div>';
}

    cagr:100*(Math.pow(last.value/first.value,1/years)-1),forecastRate:100*fc.value/last.value,

// Тема 8, задача 8.1: источник — исходный ряд преподавателя, отдельная модель сглаживания.
// Окно 3 года явно объявлено учебным выбором, а не требованием исходного документа.
function trendData(){
  var rows=currentTask.series, n=rows.length, yc=(rows[0].year+rows[n-1].year)/2;
  var sum=rows.reduce(function(s,r){return s+r.cost;},0), mean=sum/n;
  var numerator=0,denominator=0;
  rows.forEach(function(r){var t=r.year-yc; numerator+=t*r.cost;denominator+=t*t;});
  var slope=numerator/denominator;
  var enriched=rows.map(function(r,i){return {year:r.year,actual:r.cost,t:r.year-yc,fitted:mean+slope*(r.year-yc),moving:i>0&&i<n-1?(rows[i-1].cost+r.cost+rows[i+1].cost)/3:null};});
  return {rows:enriched,mean:mean,n:n,yearCenter:yc,slope:slope, numerator:numerator,denominator:denominator,first:enriched[0],last:enriched[n-1],movingWindow:currentTask.movingAverageWindow};
}
function trendChart(v){
  var W=680,H=285,L=46,R=24,T=16,B=52,lo=148,hi=219;
  function xx(i){return L+(W-L-R)*i/(v.n-1);}
  function yy(z){return H-B-(H-T-B)*(z-lo)/(hi-lo);}

// Тема 8 / задача 8.2. Данные исходного задания 2017–2026; 2027 — прогноз.
// «Гипербола второго порядка» раскрыта как учебная модель y=a+b/t+c/t² с t=1..10.
var trend2State=null;
function trend2Solve3(A,b){
    var m=A.map(function(r,i){return r.slice().concat(b[i]);});
    for(var j=0;j<3;j++){
        var max=j;for(var k=j+1;k<3;k++){if(Math.abs(m[k][j])>Math.abs(m[max][j]))max=k;}
        var temp=m[j];m[j]=m[max];m[max]=temp;
        var pivot=m[j][j];if(Math.abs(pivot)<1e-12)throw Error('Невозможно вычислить коэффициенты гиперболы');
        for(var c=j;c<4;c++)m[j][c]/=pivot;
        for(var r=0;r<3;r++)if(r!==j){var factor=m[r][j];for(var z=j;z<4;z++)m[r][z]-=factor*m[j][z];}
    }
    return m.map(function(r){return r[3];});
}
function trend2Data(){
    var rows=currentTask.series.map(function(row,i){return {year:row.year,actual:row.value,t:i+1};});
    var n=rows.length,ys=rows.reduce(function(s,r){return s+r.actual;},0),xs=rows.reduce(function(s,r){return s+r.t;},0);
    var center=xs/n,mean=ys/n,xy=0,xx=0;
    rows.forEach(function(r){xy+=(r.t-center)*(r.actual-mean);xx+=(r.t-center)*(r.t-center);});
    var slope=xy/xx,intercept=mean-slope*center;
    var mat=[[0,0,0],[0,0,0],[0,0,0]],rhs=[0,0,0];
    rows.forEach(function(r){var x=[1,1/r.t,1/(r.t*r.t)];for(var i=0;i<3;i++){rhs[i]+=x[i]*r.actual;for(var j=0;j<3;j++)mat[i][j]+=x[i]*x[j];}});
    var coeff=trend2Solve3(mat,rhs),sseLine=0,sseHyper=0;
    rows.forEach(function(r){r.linear=intercept+slope*r.t;r.hyper=coeff[0]+coeff[1]/r.t+coeff[2]/(r.t*r.t);r.base=r.actual/rows[0].actual*100;sseLine+=Math.pow(r.actual-r.linear,2);sseHyper+=Math.pow(r.actual-r.hyper,2);});
    var groups=[];for(var g=0;g<n;g+=2){groups.push({first:rows[g].year,last:rows[g+1].year,average:(rows[g].actual+rows[g+1].actual)/2,raw:[rows[g].actual,rows[g+1].actual]});}
    return {rows:rows,n:n,mean:mean,intercept:intercept,slope:slope,hyper:coeff,sseLine:sseLine,sseHyper:sseHyper,groups:groups,forecast:currentTask.forecast};
}
function trend2Chart(v){
    var W=685,H=304,L=49,R=26,T=16,B=56,lo=6.4,hi=12.5;
    function xx(i){return L+(W-L-R)*i/10;}
    function yy(y){return H-B-(H-T-B)*(y-lo)/(hi-lo);}
    function path(key){return v.rows.map(function(r,i){return(i?'L':'M')+xx(i).toFixed(1)+','+yy(r[key]).toFixed(1);}).join(' ');}
    var grid=[7,8,9,10,11,12].map(function(y){return '<line class="dyn-gridline" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy(y)+'" y2="'+yy(y)+'"/><text class="dyn-axis" x="'+(L-10)+'" y="'+(yy(y)+5)+'" text-anchor="end">'+y+'</text>';}).join('');
    var years=[0,2,4,6,8,10].map(function(i){return '<text class="dyn-axis" x="'+xx(i)+'" y="'+(H-14)+'" text-anchor="middle">'+(2017+i)+'</text>';}).join('');
    var circles=v.rows.map(function(r,i){return '<circle class="dyn-point" cx="'+xx(i)+'" cy="'+yy(r.actual)+'" r="3.8"><title>'+r.year+': '+dynFmt(r.actual,1)+' млн руб. (факт)</title></circle>';}).join('');
    var models=trend2State&&trend2State.models?'<path class="t2-line-model" d="'+path('linear')+'"/><path class="t2-hyper-model" d="'+path('hyper')+'"/>':'';
    var forecast='<path class="adyn-forecast-line" d="M'+xx(9)+','+yy(v.rows[9].actual)+' L'+xx(10)+','+yy(v.forecast.value)+'"/><circle class="adyn-forecast-point" cx="'+xx(10)+'" cy="'+yy(v.forecast.value)+'" r="5"><title>2027: '+v.forecast.value+' млн руб. — прогноз, не факт</title></circle><text class="t2-forecast-text" x="'+(xx(10)-3)+'" y="'+(yy(v.forecast.value)-11)+'" text-anchor="end">ПРОГНОЗ</text>';
    return '<div class="dyn-chart-container" role="img" aria-label="Объём рекламной продукции: фактический выпуск 2017–2026, отдельно прогноз на 2027'+(trend2State&&trend2State.models?', линейная и гиперболическая аппроксимации':'')+'"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+grid+models+'<path class="dyn-line" d="'+path('actual')+'"/>'+forecast+circles+years+'</svg></div><div class="t2-legend"><span><i class="t2-swatch-fact"></i>Факт</span><span><i class="t2-swatch-forecast"></i>Прогноз 2027</span>'+(trend2State&&trend2State.models?'<span><i class="t2-swatch-line"></i>Прямая</span><span><i class="t2-swatch-hyper"></i>Гипербола II порядка</span>':'')+'</div>';
}

    else{trend2State.done=true;trend2Summary(v);}
}
function trend2Table(v){return '<details class="dyn-full"><summary>📋 Теоретические уровни, отклонения и темпы за все 10 лет</summary><p class="dyn-muted">Прямая: a+bt. Гипербола: a+b/t+c/t². Базисные темпы — к 2017 году; цепные — к предыдущему. Только фактические годы.</p><div class="dyn-table-wrap"><table class="dyn-table"><thead><tr><th>Год</th><th>Факт</th><th>Прямая ŷ</th><th>Гипербола ŷ</th><th>Базисный, %</th><th>Цепной, %</th></tr></thead><tbody>'+v.rows.map(function(r,i){return '<tr><th>'+r.year+'</th><td>'+dynFmt(r.actual,1)+'</td><td>'+dynFmt(r.linear)+'</td><td>'+dynFmt(r.hyper)+'</td><td>'+dynFmt(r.base)+'</td><td>'+(i?dynFmt(100*r.actual/v.rows[i-1].actual):'—')+'</td></tr>';}).join('')+'</tbody></table></div></details>';}
function trend2Summary(v){
    var host=document.getElementById('trend2-summary');
    host.innerHTML='<section class="dyn-panel dyn-summary" id="trend2-summary-panel"><h2>✅ Общая тенденция производства</h2><div class="dyn-metrics">'+[
    ['Факт 2017 → 2026','7,3 → 10,0','млн руб.'],['Средний годовой прирост по прямой','+'+dynFmt(v.slope,3),'млн руб./год'],['Ошибка прямой (Σe²)',dynFmt(v.sseLine,4),'(млн руб.)²'],['Ошибка гиперболы (Σe²)',dynFmt(v.sseHyper,4),'(млн руб.)²']].map(function(m){return '<div class="dyn-metric"><span>'+m[0]+'</span><strong>'+m[1]+'</strong><small>'+m[2]+'</small></div>';}).join('')+'</div><p class="dyn-note"><b>Вывод:</b> выпуск рекламной продукции за 2017–2026 годы растёт. На этих наблюдениях линейная модель даёт меньшую сумму квадратов отклонений, чем выбранная модель гиперболы второго порядка. Средние по укрупнённым двухлетним интервалам также растут. Значение 12 млн руб. за 2027 год — только исходный прогноз, а не подтверждённый факт.</p>'+trend2Table(v)+'<details class="dyn-full"><summary>📦 Укрупнение периодов: пять двухлетних интервалов</summary><div class="t2-period-grid">'+v.groups.map(function(g){return '<div class="t2-period"><strong>'+g.first+'–'+g.last+'</strong><span>'+dynFmt(g.raw[0],1)+' + '+dynFmt(g.raw[1],1)+' → '+dynFmt(g.average,2)+' млн руб.</span></div>';}).join('')+'</div></details><div class="dyn-inspector"><h3>🔎 Откуда взялись теоретические уровни?</h3><label for="trend2-inspect-year">Выбери год для разбора</label><select id="trend2-inspect-year" onchange="trend2Inspect(this.value)">'+v.rows.map(function(r,i){return '<option value="'+i+'"'+(i===4?' selected':'')+'>'+r.year+'</option>';}).join('')+'</select><div id="trend2-year-detail"></div></div></section>';
    trend2Inspect('4');trend2State.guide=0;trend2State.opened={};trend2RenderGuide(v);dynScroll('trend2-summary-panel');
}
function trend2Inspect(s){var v=trend2Data(),i=Number(s),r=v.rows[i],h=document.getElementById('trend2-year-detail');if(!h||!r)return;h.innerHTML=dynEquation('<b>'+r.year+' год:</b> фактически '+dynFmt(r.actual,1)+' млн руб.; код времени t='+r.t+'.')+dynEquation('<span class="dyn-gold">Прямая:</span> '+dynFmt(v.intercept,4)+' + '+dynFmt(v.slope,4)+' × '+r.t+' = <b>'+dynFmt(r.linear)+' млн руб.</b>')+dynEquation('<span class="t2-hyper-text">Гипербола:</span> '+dynFmt(v.hyper[0],4)+' '+(v.hyper[1]<0?'−':' +')+' '+dynFmt(Math.abs(v.hyper[1]),4)+'/'+r.t+' + '+dynFmt(v.hyper[2],4)+'/'+r.t+'² = <b>'+dynFmt(r.hyper)+' млн руб.</b>')+dynEquation('Базисный темп = '+dynFmt(r.actual,1)+' / 7,3 × 100 = <b>'+dynFmt(r.base)+'%</b>.'+(i?' Цепной = '+dynFmt(r.actual,1)+' / '+dynFmt(v.rows[i-1].actual,1)+' × 100 = <b>'+dynFmt(100*r.actual/v.rows[i-1].actual)+'%</b>.':''));}
function trend2GuideText(i,v){var e=[
    '<p>В исходном задании <b>10 фактических наблюдений</b>: 2017–2026. Прогноз за 2027 год равен 12 млн руб. Он важен для обсуждения будущего, но не должен участвовать в расчёте коэффициентов по фактическому ряду.</p>'+dynEquation('Рост факта: 10,0 − 7,3 = <b>2,7 млн руб.</b>; относительный прирост = (10,0 / 7,3 − 1) × 100 ≈ <b>'+dynFmt((10/7.3-1)*100)+'%</b>.'),
    '<p>Метод наименьших квадратов подбирает коэффициенты, минимизируя сумму квадратов различий между фактами и уровнями модели. Для прямой ŷ = a + bt используем t = 1…10. Для выбранной формы гиперболы второго порядка — ŷ = a+b/t+c/t².</p>'+dynEquation('Прямая: ŷ = <b>'+dynFmt(v.intercept,4)+' + '+dynFmt(v.slope,4)+'t</b>. Среднее y = '+dynFmt(v.mean)+' млн руб.; t̄ = 5,5.')+dynEquation('Гиперболическая модель: ŷ = <b>'+dynFmt(v.hyper[0],4)+(v.hyper[1]<0?' − ':' + ')+dynFmt(Math.abs(v.hyper[1]),4)+'/t'+(v.hyper[2]<0?' − ':' + ')+dynFmt(Math.abs(v.hyper[2]),4)+'/t²</b>.')+'<p class="dyn-muted">Коэффициенты обеих моделей подобраны по 10 фактическим годам методом наименьших квадратов. Это выбранная учебная форма гиперболической модели; формула в листе преподавателя не уточнена.</p>',
    '<p>Вместо подгонки графика «на глаз» для каждого фактического года вычисляем теоретические уровни и сравниваем суммы квадратов остатков. У этих данных <b>прямая описывает наблюдения лучше</b> по выбранному показателю.</p>'+dynEquation('Σ(факт − прямая)² = <b>'+dynFmt(v.sseLine,4)+'</b>; Σ(факт − гипербола)² = <b>'+dynFmt(v.sseHyper,4)+'</b>.')+'<p>Теоретический уровень не обязан совпадать с реальным. Нельзя делать вывод, что одна модель всегда лучше другой на любых данных.</p>',
    '<p>Чтобы восстановить цепной темп из базисных, достаточно отношения двух соседних базисных темпов. Начальный уровень 2017 года сокращается.</p>'+dynEquation('Tбаз 2021 / Tбаз 2020 × 100% = ('+dynFmt(v.rows[4].base,4)+' / '+dynFmt(v.rows[3].base,4)+') × 100% = <b>106,25%</b>.')+'<p>Это тот же результат, что и прямое отношение фактов: 8,5 / 8,0 × 100%.</p>',
    '<p>Метод укрупнения интервалов заменяет каждую пару соседних лет их средним значением. Мы выбираем <b>равные интервалы по два года</b>, чтобы сравнение было корректным. В задании размер интервала не предписан; это явное учебное решение.</p>'+dynEquation(v.groups.map(function(g){return g.first+'–'+g.last+': <b>'+dynFmt(g.average)+' млн руб.</b>';}).join('<br>'))+'<p>Средние растут. Однако это описание прошлого, не доказательство точности прогноза на 2027 год.</p>'
    ];return e[i];}
function trend2RenderGuide(v){if(!trend2State||!trend2State.done)return;var steps=[['Наблюдения и прогноз','Почему 2027 год не входит в расчёт трендов?'],['Как строятся две модели?','Зачем нужны коэффициенты и как выбираем код времени?'],['Какая кривая ближе к данным?','Что показывает сумма квадратов остатков?'],['Базисный и цепной темпы','Как из двух базисных темпов получить один цепной?'],['Укрупнение периодов','Почему средние по двум соседним годам помогают увидеть тенденцию?']];var i=trend2State.guide,h=document.getElementById('trend2-guide');if(i>=5){statisticsCelebrateOnce();h.innerHTML='<section class="dyn-panel dyn-summary"><h2>🎓 Разбор завершён!</h2><p>Ты исследовал фактическую тенденцию, сравнил модели, восстановил цепные темпы и сгладил ряд методом укрупнения периодов.</p><button class="dyn-primary" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">К списку задач</button></section>';return;}var opened=!!trend2State.opened[i];h.innerHTML='<section class="dyn-panel dyn-guide" id="trend2-guide-panel"><div class="dyn-guide-top"><span>ПОШАГОВОЕ ОБЪЯСНЕНИЕ</span><span>'+(i+1)+' / 5</span></div><div class="dyn-progress">'+steps.map(function(_,j){return '<span class="'+(j<=i?'dyn-progress-on':'')+'"></span>';}).join('')+'</div><div class="dyn-question"><h2>'+steps[i][0]+'</h2><p>'+steps[i][1]+'</p></div>'+(opened?'<div class="dyn-guide-content">'+trend2GuideText(i,v)+'</div>':'<button class="dyn-reveal" onclick="trend2Reveal()">ПОКАЗАТЬ ОБЪЯСНЕНИЕ</button>')+'<div class="dyn-nav"><button onclick="trend2Back()" '+(i===0?'disabled':'')+'>← Назад</button><button class="dyn-next" onclick="trend2Next()" '+(opened?'':'disabled')+'>'+(i===4?'Завершить':'Следующий шаг →')+'</button></div></section>';}
function trend2Reveal(){trend2State.opened[trend2State.guide]=true;trend2RenderGuide(trend2Data());}
function trend2Back(){if(trend2State.guide<=0)return;trend2State.guide--;trend2RenderGuide(trend2Data());dynScroll('trend2-guide-panel');}
function trend2Next(){if(!trend2State.opened[trend2State.guide])return;trend2State.guide++;trend2RenderGuide(trend2Data());dynScroll('trend2-guide-panel');}

</script>
</body>
</html>
