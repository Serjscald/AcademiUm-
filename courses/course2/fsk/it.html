<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Информационные технологии — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css">
</head>
<body>

<div id="start-screen">
    <h2>💻 Информационные технологии</h2>
    <p>Нажмите, чтобы начать обучение</p>
</div>

<canvas id="fireworks-canvas"></canvas>
<div class="app-container" id="app"></div>

<script src="../../../js/core.js"></script>
<script src="../../../js/data-it.js"></script>
<script>
var app = document.getElementById('app');
var currentCards = [];
var cardIndex = 0;
var quizIndex = 0;
var mistakes = 0;
var currentMode = 'learn';
var currentQuizDirection = 'term-to-def';

// --- ИСПРАВЛЕНИЕ ЗВУКА: Глобальная инициализация при первом клике ---
document.addEventListener('click', function initAudioOnce() {
    if (typeof initAudio === 'function') {
        initAudio();
    }
    document.removeEventListener('click', initAudioOnce);
}, { once: true });

function renderScreen(screenName, data) {
    app.innerHTML = '';
    
    if (screenName === 'modes') {
        app.innerHTML = '<h1>Информационные технологии</h1><div class="subtitle">Выберите режим</div><div class="grid" style="margin-top:40px"><div class="tile" onclick="handleMode(\'learn\')">Обучение</div><div class="tile" onclick="handleMode(\'quiz\')">Контроль</div></div><button class="btn btn-back" onclick="navigateTo(\'index.html\')">Назад</button>';
    } 
    else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn';
        currentMode = mode;
        var title = (mode === 'learn') ? 'Обучение' : 'Контроль';
        var topicsHTML = '';
        
        if (mode === 'quiz') {
            topicsHTML += '<div class="tile" onclick="startTopic(\'all\')">За все время</div>';
        }
        
        // Динамическая генерация тем из itDB.topicTitles
        for (var key in itDB.topicTitles) {
            topicsHTML += '<div class="tile" onclick="startTopic(\'' + key + '\')">' + itDB.topicTitles[key] + '</div>';
        }
        
        app.innerHTML = '<h1>' + title + '</h1><div class="subtitle">Выберите тему</div><div class="grid single-col" style="margin-top:20px">' + topicsHTML + '</div><button class="btn btn-back" onclick="renderScreen(\'modes\')">Назад</button>';
    } 
    else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        app.innerHTML = '<h1>Карточка ' + (cardIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div></div><button class="btn btn-orange" onclick="nextCard()">Следующая</button><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    } 
    else if (screenName === 'quiz') {
        var qcard = currentCards[quizIndex];
        currentQuizDirection = (Math.random() < 0.5) ? 'term-to-def' : 'def-to-term';
        var questionText = (currentQuizDirection === 'term-to-def') ? qcard.word : qcard.trans;
        var correctAnswer = (currentQuizDirection === 'term-to-def') ? qcard.trans : qcard.word;
        var optionsPool = currentCards.map(function(c){ return (currentQuizDirection === 'term-to-def') ? c.trans : c.word; });
        var options = [correctAnswer];
        while (options.length < 3) { var rnd = optionsPool[Math.floor(Math.random() * optionsPool.length)]; if (options.indexOf(rnd) === -1) options.push(rnd); }
        options.sort(function(){ return Math.random() - 0.5; });
        var optsHTML = '';
        for (var i = 0; i < options.length; i++) {
            var o = options[i].replace(/'/g, "\\'"); var ca = correctAnswer.replace(/'/g, "\\'");
            optsHTML += '<div class="quiz-opt" onclick="checkAnswer(this,\'' + o + '\',\'' + ca + '\')">' + options[i].substring(0, 100) + (options[i].length > 100 ? '...' : '') + '</div>';
        }
        app.innerHTML = '<h1>Контроль ' + (quizIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard" id="quiz-card"><div class="fc-word" style="font-size:20px">' + questionText + '</div><div class="fc-trans" style="font-size:14px;color:var(--text-muted)">' + (currentQuizDirection === 'term-to-def' ? 'Выберите определение:' : 'Выберите термин:') + '</div></div><div class="quiz-options">' + optsHTML + '</div><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'quiz\'})">Прервать</button>';
    } 
    else if (screenName === 'result') {
        var isWin = (mistakes === 0);
        var msg = isWin ? '🎉 Отличная работа!' : 'Нужно заниматься усерднее, Данечка!';
        var cls = isWin ? 'result-win' : 'result-lose';
        app.innerHTML = '<h1>Результат</h1><div class="result-msg ' + cls + '">' + msg + '</div><button class="btn btn-orange" onclick="renderScreen(\'modes\')">В меню</button><button class="btn btn-back" onclick="navigateTo(\'../../../index.html\')">На главную</button>';
        if (isWin && typeof startFireworks === 'function') startFireworks();
    }
}

function handleMode(mode) { 
    if(event && event.target) event.target.classList.add('success'); 
    if(typeof playSound === 'function') playSound('success'); 
    setTimeout(function(){ renderScreen('topics', {mode: mode}); }, 400); 
}

function startTopic(scope) {
    if(event && event.target) event.target.classList.add('success'); 
    if(typeof playSound === 'function') playSound('success');
    
    if (scope === 'all') {
        currentCards = [];
        for (var key in itDB.topicTitles) currentCards = currentCards.concat(itDB[key]);
    } else {
        currentCards = itDB[scope].slice();
    }
    currentCards.sort(function(){ return Math.random() - 0.5; });
    
    if (currentMode === 'learn') {
        cardIndex = 0;
        setTimeout(function(){ renderScreen('flashcard'); }, 400);
    } else {
        quizIndex = 0; mistakes = 0;
        setTimeout(function(){ renderScreen('quiz'); }, 400);
    }
}

function nextCard() { 
    if(typeof playSound === 'function') playSound('success'); 
    cardIndex++; 
    if (cardIndex < currentCards.length) renderScreen('flashcard'); 
    else renderScreen('topics', {mode: 'learn'}); 
}

function checkAnswer(el, selected, correct) {
    var card = document.getElementById('quiz-card');
    if (selected === correct) { 
        el.classList.add('correct'); 
        card.classList.add('correct-flash'); 
        if(typeof playSound === 'function') playSound('success'); 
    } else { 
        el.classList.add('wrong'); 
        card.classList.add('wrong-flash'); 
        if(typeof playSound === 'function') playSound('error'); 
        mistakes++; 
    }
    setTimeout(function(){ 
        quizIndex++; 
        if (quizIndex < currentCards.length) renderScreen('quiz'); 
        else renderScreen('result'); 
    }, 600);
}

var startScreen = document.getElementById('start-screen');
if (startScreen) {
    startScreen.addEventListener('click', function(){ 
        startScreen.style.opacity = '0'; 
        setTimeout(function(){ startScreen.style.display = 'none'; }, 500); 
        renderScreen('modes'); 
    });
}
</script>
</body>
</html>
