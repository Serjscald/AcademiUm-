<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АкадемиУм! | Статистика</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* Дополнительные стили специально для раздела Задач */
        .task-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* Таблица задачи */
        .stats-table { width: 100%; border-collapse: collapse; margin: 20px 0; background: #1e293b; border-radius: 12px; overflow: hidden; }
        .stats-table th, .stats-table td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; color: #f8fafc; }
        .stats-table th { background: #0f172a; color: #fbbf24; font-weight: bold; text-transform: uppercase; font-size: 0.9em; }
        .stats-table tr:last-child td { border-bottom: none; }
        
        /* Кликабельные ячейки */
        .clickable-cell { 
            cursor: pointer; display: inline-block; padding: 6px 12px; 
            border-radius: 6px; border: 2px solid transparent; transition: all 0.2s; 
            font-weight: bold; min-width: 40px;
        }
        .clickable-cell:hover { background: rgba(251, 191, 36, 0.1); border-color: #fbbf24; }
        .clickable-cell.selected { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }
        .clickable-cell.error { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }
        
        /* Выпадающий список выбора переменной */
        .var-selector-popup {
            position: absolute; background: #1e293b; border: 2px solid #fbbf24; 
            border-radius: 8px; padding: 10px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 5px; min-width: 150px;
        }
        .var-option {
            padding: 8px 12px; border-radius: 4px; cursor: pointer; color: #f8fafc; 
            transition: background 0.2s; text-align: left;
        }
        .var-option:hover { background: #334155; }
        
        /* Кнопки и прогресс */
        .solve-btn-area { text-align: center; margin-top: 30px; }
        .btn-solve { 
            background: #22c55e; color: white; border: none; padding: 15px 40px; 
            border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; 
            transition: all 0.3s; opacity: 0.5; pointer-events: none;
        }
        .btn-solve.active { opacity: 1; pointer-events: all; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
        .btn-solve:hover { transform: translateY(-2px); }
        
        .progress-counter { text-align: center; color: #94a3b8; margin-top: 15px; font-size: 0.9em; }
        
        /* Блок решения */
        .solution-area { 
            margin-top: 30px; border: 2px solid #22c55e; border-radius: 12px; 
            padding: 25px; background: rgba(34, 197, 94, 0.05); display: none; 
        }
        .solution-step { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
        .solution-step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .step-title { color: #fbbf24; font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
        .step-text { line-height: 1.6; color: #e2e8f0; white-space: pre-line; }
        .conclusion-box { 
            background: rgba(251, 191, 36, 0.1); border-left: 4px solid #fbbf24; 
            padding: 15px; margin-top: 20px; border-radius: 0 8px 8px 0; 
        }
        .conclusion-title { color: #fbbf24; font-weight: bold; margin-bottom: 8px; }
        
        /* Навигация по задачам */
        .task-nav { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-nav { 
            background: #334155; color: #f8fafc; border: none; padding: 12px 25px; 
            border-radius: 8px; cursor: pointer; transition: all 0.2s; 
        }
        .btn-nav:hover { background: #475569; }
        
        /* Адаптив для мобильных */
        @media (max-width: 768px) {
            .stats-table { font-size: 0.8em; }
            .stats-table th, .stats-table td { padding: 8px 4px; }
            .clickable-cell { padding: 4px 6px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="page-header">
            <h1>📊 СТАТИСТИКА</h1>
            <button class="btn-back" onclick="window.location.href='index.html'">← Назад</button>
        </header>

        <!-- Вкладки режимов -->
        <div class="mode-tabs">
            <button class="tab-btn active" data-mode="learn">📖 Обучение</button>
            <button class="tab-btn" data-mode="control">📝 Контроль</button>
            <button class="tab-btn" data-mode="tasks"> Задачи</button>
        </div>

        <!-- Контейнер контента -->
        <div id="content-area">
            
            <!-- Режим: ОБУЧЕНИЕ (заглушка, можно наполнить позже) -->
            <div id="mode-learn" class="mode-content active">
                <div class="placeholder-card">
                    <h2>Теоретические материалы</h2>
                    <p>Здесь будут карточки с определениями, формулами и примерами по статистике.</p>
                    <p><em>(Раздел в разработке)</em></p>
                </div>
            </div>

            <!-- Режим: КОНТРОЛЬ (заглушка) -->
            <div id="mode-control" class="mode-content">
                <div class="placeholder-card">
                    <h2>Тестирование</h2>
                    <p>224 вопроса по всем темам курса статистики.</p>
                    <button class="btn-primary" onclick="alert('Функция контроля будет подключена из data-statistics.js')">Начать тест</button>
                </div>
            </div>

            <!-- Режим: ЗАДАЧИ (полностью рабочий) -->
            <div id="mode-tasks" class="mode-content">
                <div class="task-container" id="task-wrapper">
                    <!-- Сюда рендерится задача через JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="../../js/data-statistics-tasks.js"></script>
    <script src="../../js/core.js"></script>
    
    <script>
        // === ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК ===
        const tabBtns = document.querySelectorAll('.tab-btn');
        const modeContents = document.querySelectorAll('.mode-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Убираем активный класс у всех
                tabBtns.forEach(b => b.classList.remove('active'));
                modeContents.forEach(c => c.classList.remove('active'));
                
                // Добавляем активный класс нажатой кнопке
                btn.classList.add('active');
                const mode = btn.dataset.mode;
                document.getElementById(`mode-${mode}`).classList.add('active');
                
                // Если открыли вкладку "Задачи" и там пусто - загружаем задачу
                if (mode === 'tasks' && !document.querySelector('.stats-table')) {
                    loadRandomTask();
                }
            });
        });

        // === ФУНКЦИЯ ЗАГРУЗКИ СЛУЧАЙНОЙ ЗАДАЧИ ===
        function loadRandomTask() {
            if (!window.statisticsTasks || window.statisticsTasks.length === 0) {
                document.getElementById('task-wrapper').innerHTML = '<p style="text-align:center;color:#ef4444;">Ошибка: данные задач не загружены!</p>';
                return;
            }
            const randomIndex = Math.floor(Math.random() * statisticsTasks.length);
            renderStatisticsTask(randomIndex);
        }

        // === ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ===
        // Если URL содержит хэш #tasks, сразу открываем вкладку задач
        if (window.location.hash === '#tasks') {
            document.querySelector('[data-mode="tasks"]').click();
        } else {
            // По умолчанию открываем обучение, но предзагружаем задачу в фон
            setTimeout(() => {
                if (!document.querySelector('.stats-table')) loadRandomTask();
            }, 500);
        }
    </script>
</body>
</html>
