<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Статистика — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <style>
        .stat-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14px; }
        .stat-table th, .stat-table td { border: 1px solid #475569; padding: 8px; text-align: center; }
        .stat-table th { background: #334155; color: var(--gold); }
        .var { color: #38bdf8; text-decoration: underline; cursor: pointer; font-weight: bold; transition: all 0.2s; position: relative; }
        .var:hover { background: rgba(56, 189, 248, 0.2); }
        .var.found { color: var(--accent-green); background: rgba(34, 197, 94, 0.2); text-decoration: none; cursor: default; }
        .task-hint { font-size: 13px; color: var(--text-muted); margin-top: 10px; font-style: italic; }
        .solution-box { background: #0f172a; border: 2px solid var(--accent-green); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: left; line-height: 1.6; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Блок формул */
        .formulas-box { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--gold); border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: left; font-size: 14px; }
        .formulas-box h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--gold); }
        .formulas-box ul { margin: 0; padding-left: 20px; }
        .formulas-box li { margin-bottom: 5px; color: var(--text-main); }
        
        /* Выпадающее меню выбора переменной */
        .var-selector { position: fixed; z-index: 1000; background: #1e293b; border: 2px solid var(--gold); border-radius: 8px; padding: 5px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .var-selector button { display: block; width: 100%; padding: 8px 15px; margin: 2px 0; background: #334155; border: none; border-radius: 5px; color: white; font-size: 14px; cursor: pointer; text-align: left; }
        .var-selector button:hover { background: var(--gold); color: #0f172a; }
        
        .btn-solve { background: var(--accent-green); color: white; margin-top: 15px; }
        .btn-solve:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>

<div id="start-screen">
    <h2>📊 Статистика</h2>
    <p>Нажмите, чтобы начать обучение</p>
</div>

<canvas id="fireworks-canvas"></canvas>

<!-- Выпадающее меню для выбора переменной -->
<div id="var-selector" class="var-selector"></div>

<div class="app-container" id="app"></div>

<script src="../../../js/core.js"></script>
<script src="../../../js/data-statistics.js"></script>
<script>
var app = document.getElementById('app');
var currentCards = [];
var cardIndex = 0;
var quizIndex = 0;
var mistakes = 0;
var currentMode = 'learn';
var currentTask = null;
var foundVars = {};
var selectedVarElement = null;

function renderScreen(screenName, data) {
    app.innerHTML = '';
    if (screenName === 'modes') {
        app.innerHTML = '<h1>Статистика</h1><div class="subtitle">Выберите режим</div><div class="grid single-col" style="margin-top:30px"><div class="tile" onclick="handleMode(\'learn\')">Обучение</div><div class="tile" onclick="handleMode(\'quiz\')">Контроль</div><div class="tile" onclick="handleMode(\'tasks\')" style="border-color:#38bdf8;color:#38bdf8">Задачи</div></div><button class="btn btn-back" onclick="navigateTo(\'index.html\')">Назад</button>';
    } else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn';
        currentMode = mode;
        var title = (mode === 'learn') ? 'Обучение' : (mode === 'quiz' ? 'Контроль' : 'Задачи');
        var topicsHTML = '<div class="tile" onclick="startTopic(\'topic1\')">Тема 1: Индексы</div>';
        if (mode === 'tasks') {
            topicsHTML = '';
            for (var i = 0; i < statisticsDB.tasks.length; i++) {
                topicsHTML += '<div class="tile" onclick="startTask(' + i + ')">' + statisticsDB.tasks[i].title + '</div>';
            }
        }
        app.innerHTML = '<h1>' + title + '</h1><div class="subtitle">Выберите тему</div><div class="grid single-col" style="margin-top:20px">' + topicsHTML + '</div><button class="btn btn-back" onclick="renderScreen(\'modes\')">Назад</button>';
    } else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        app.innerHTML = '<h1>Карточка ' + (cardIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div></div><button class="btn btn-orange" onclick="nextCard()">Следующая</button><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    } else if (screenName === 'quiz') {
        var qcard = currentCards[quizIndex];
        currentQuizDirection = (Math.random() < 0.5) ? 'term-to-def' : 'def-to-term';
        var questionText, correctAnswer, optionsPool;
        if (currentQuizDirection === 'term-to-def') {
            questionText = qcard.word; correctAnswer = qcard.trans;
            optionsPool = currentCards.map(function(c){ return c.trans; });
        } else {
            questionText = qcard.trans; correctAnswer = qcard.word;
            optionsPool = currentCards.map(function(c){ return c.word; });
        }
        var options = [correctAnswer];
        while (options.length < 3) {
            var rnd = optionsPool[Math.floor(Math.random() * optionsPool.length)];
            if (options.indexOf(rnd) === -1) options.push(rnd);
        }
        options.sort(function(){ return Math.random() - 0.5; });
        var optsHTML = '';
        for (var i = 0; i < options.length; i++) {
            var o = options[i].replace(/'/g, "\\'");
            var ca = correctAnswer.replace(/'/g, "\\'");
            var disp = options[i].substring(0, 100) + (options[i].length > 100 ? '...' : '');
            optsHTML += '<div class="quiz-opt" onclick="checkAnswer(this,\'' + o + '\',\'' + ca + '\')">' + disp + '</div>';
        }
        var hint = (currentQuizDirection === 'term-to-def') ? 'Выберите определение:' : 'Выберите термин:';
        app.innerHTML = '<h1>Контроль ' + (quizIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard" id="quiz-card"><div class="fc-word" style="font-size:20px">' + questionText + '</div><div class="fc-trans" style="font-size:14px;color:var(--text-muted)">' + hint + '</div></div><div class="quiz-options">' + optsHTML + '</div><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'quiz\'})">Прервать</button>';
    } else if (screenName === 'task') {
        foundVars = {};
        // Формируем блок формул
        var formulasHTML = '<div class="formulas-box"><h3>📐 Формулы для решения:</h3><ul>';
        for (var f = 0; f < currentTask.formulas.length; f++) {
            formulasHTML += '<li>' + currentTask.formulas[f] + '</li>';
        }
        formulasHTML += '</ul></div>';
        
        app.innerHTML = '<h1>' + currentTask.title + '</h1>' + formulasHTML + '<div class="flashcard" style="border-color:#38bdf8;text-align:left;padding:20px">' + currentTask.html + '</div><div id="task-progress" style="margin-top:15px;font-size:14px;color:var(--text-muted)">Назначено переменных: 0 / ' + currentTask.requiredVars.length + '</div><button id="solve-btn" class="btn btn-solve" onclick="solveTask()" disabled>Решить задачу</button><div id="task-solution"></div><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">К списку задач</button>';
        attachVarListeners();
    } else if (screenName === 'result') {
        var isWin = (mistakes === 0);
        var msg = isWin ? '🎉 Отличная работа!' : 'Нужно заниматься усерднее, Данечка!';
        var cls = isWin ? 'result-win' : 'result-lose';
        app.innerHTML = '<h1>Результат</h1><div class="result-msg ' + cls + '">' + msg + '</div><button class="btn btn-orange" onclick="renderScreen(\'modes\')">В меню</button><button class="btn btn-back" onclick="navigateTo(\'../../../index.html\')">На главную</button>';
        if (isWin) startFireworks();
    }
}

function handleMode(mode) {
    var el = event.target;
    el.classList.add('success');
    playSound('success');
    setTimeout(function(){ renderScreen('topics', {mode: mode}); }, 400);
}

function startTopic(scope) {
    var el = event.target;
    el.classList.add('success');
    playSound('success');
    currentCards = statisticsDB[scope].slice();
    currentCards.sort(function(){ return Math.random() - 0.5; });
    if (currentMode === 'learn') {
        cardIndex = 0;
        setTimeout(function(){ renderScreen('flashcard'); }, 400);
    } else {
        quizIndex = 0; mistakes = 0;
        setTimeout(function(){ renderScreen('quiz'); }, 400);
    }
}

function startTask(idx) {
    var el = event.target;
    el.classList.add('success');
    playSound('success');
    currentTask = statisticsDB.tasks[idx];
    setTimeout(function(){ renderScreen('task'); }, 400);
}

function attachVarListeners() {
    var vars = document.querySelectorAll('.var');
    var selector = document.getElementById('var-selector');
    
    for (var i = 0; i < vars.length; i++) {
        vars[i].addEventListener('click', function(e) {
            if (this.classList.contains('found')) return;
            e.stopPropagation();
            selectedVarElement = this;
            
            // Позиционируем меню рядом с кликнутой ячейкой
            var rect = this.getBoundingClientRect();
            selector.style.left = rect.left + 'px';
            selector.style.top = (rect.bottom + 5) + 'px';
            selector.style.display = 'block';
            
            // Генерируем кнопки выбора
            selector.innerHTML = '';
            var labels = currentTask.varLabels;
            for (var key in labels) {
                var btn = document.createElement('button');
                btn.innerText = labels[key];
                btn.setAttribute('data-key', key);
                btn.onclick = function() { assignVar(this.getAttribute('data-key')); };
                selector.appendChild(btn);
            }
        });
    }
    
    // Закрыть меню при клике вне его
    document.addEventListener('click', function() {
        selector.style.display = 'none';
    });
}

function assignVar(varKey) {
    if (!selectedVarElement) return;
    var val = parseFloat(selectedVarElement.getAttribute('data-val'));
    
    // Находим уникальный ID для этой ячейки (по позиции в таблице)
    var row = selectedVarElement.parentElement.rowIndex;
    var col = selectedVarElement.cellIndex;
    var uniqueId = varKey + '_' + row + '_' + col;
    
    foundVars[uniqueId] = val;
    selectedVarElement.classList.add('found');
    selectedVarElement.innerText = varKey + '=' + val;
    playSound('success');
    
    document.getElementById('var-selector').style.display = 'none';
    updateTaskProgress();
}

function updateTaskProgress() {
    var count = Object.keys(foundVars).length;
    var total = currentTask.requiredVars.length;
    document.getElementById('task-progress').innerText = 'Назначено переменных: ' + count + ' / ' + total;
    document.getElementById('solve-btn').disabled = (count < total);
}

function solveTask() {
    // Преобразуем foundVars в формат, ожидаемый функцией solve
    // Маппинг по порядку ячеек таблицы
    var v = {};
    var keys = Object.keys(foundVars);
    var reqKeys = currentTask.requiredVars;
    for (var i = 0; i < keys.length; i++) {
        // Извлекаем базовый ключ (p0, q1 и т.д.) и номер строки
        var parts = keys[i].split('_');
        var baseKey = parts[0];
        var rowNum = parseInt(parts[1]);
        var mappedKey = baseKey + '_' + rowNum;
        v[mappedKey] = foundVars[keys[i]];
    }
    
    var sol = currentTask.solve(v);
    document.getElementById('task-solution').innerHTML = '<div class="solution-box">' + sol + '</div>';
    playSound('success');
    setTimeout(function(){ playSound('success'); }, 200);
}

function nextCard() {
    playSound('success');
    cardIndex++;
    if (cardIndex < currentCards.length) renderScreen('flashcard');
    else renderScreen('topics', {mode: 'learn'});
}

function checkAnswer(el, selected, correct) {
    var card = document.getElementById('quiz-card');
    if (selected === correct) {
        el.classList.add('correct'); card.classList.add('correct-flash'); playSound('success');
    } else {
        el.classList.add('wrong'); card.classList.add('wrong-flash'); playSound('error'); mistakes++;
    }
    setTimeout(function(){
        quizIndex++;
        if (quizIndex < currentCards.length) renderScreen('quiz');
        else renderScreen('result');
    }, 600);
}

var startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', function(){
    initAudio();
    startScreen.style.opacity = '0';
    setTimeout(function(){ startScreen.style.display = 'none'; }, 500);
    renderScreen('modes');
});
</script>
</body>
</html>
