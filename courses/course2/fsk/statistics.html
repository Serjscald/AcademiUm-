<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АкадемиУм! | Статистика</title>
    <!-- Убедись, что путь к стилям верный относительно этого файла -->
    <link rel="stylesheet" href="../../css/style.css"> 
    <style>
        /* Базовые стили для диагностики и интерфейса */
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .error-box { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .tab-btn { background: #1e293b; border: none; color: #94a3b8; padding: 10px 20px; cursor: pointer; border-radius: 6px; margin-right: 5px; }
        .tab-btn.active { background: #fbbf24; color: #0f172a; font-weight: bold; }
        .mode-content { display: none; margin-top: 20px; }
        .mode-content.active { display: block; }
        
        /* Стили таблицы задач */
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        .stats-table th, .stats-table td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; }
        .stats-table th { background: #0f172a; color: #fbbf24; }
        .clickable-cell { cursor: pointer; padding: 5px 10px; border-radius: 4px; border: 1px solid transparent; display: inline-block; min-width: 30px; }
        .clickable-cell:hover { background: rgba(251, 191, 36, 0.2); border-color: #fbbf24; }
        .clickable-cell.selected { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }
        .clickable-cell small { display: block; font-size: 0.7em; color: #94a3b8; margin-bottom: 2px; }
        
        .btn-solve { background: #22c55e; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 1.1em; cursor: pointer; opacity: 0.5; pointer-events: none; margin-top: 20px; }
        .btn-solve.active { opacity: 1; pointer-events: all; }
        .solution-area { margin-top: 30px; border: 1px solid #22c55e; padding: 20px; border-radius: 8px; background: rgba(34, 197, 94, 0.05); display: none; }
    </style>
</head>
<body>

    <h1>📊 СТАТИСТИКА</h1>
    
    <div style="margin-bottom: 20px;">
        <button class="tab-btn active" onclick="switchTab('learn')">📖 Обучение</button>
        <button class="tab-btn" onclick="switchTab('control')">📝 Контроль</button>
        <button class="tab-btn" onclick="switchTab('tasks')">🧩 Задачи</button>
    </div>

    <!-- Вкладка Обучение -->
    <div id="tab-learn" class="mode-content active">
        <h2>Теоретические материалы</h2>
        <p>Раздел в разработке...</p>
    </div>

    <!-- Вкладка Контроль -->
    <div id="tab-control" class="mode-content">
        <h2>Тестирование</h2>
        <p>224 вопроса по всем темам.</p>
    </div>

    <!-- Вкладка Задачи -->
    <div id="tab-tasks" class="mode-content">
        <div id="task-container">
            <p style="text-align:center; color:#94a3b8;">Нажмите, чтобы загрузить задачу...</p>
            <button onclick="loadRandomTask()" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;">Загрузить случайную задачу</button>
        </div>
        <div id="debug-info" class="error-box" style="display:none;"></div>
    </div>

    <!-- Подключение скриптов -->
    <!-- ВАЖНО: Проверь, что пути ведут к реальным файлам! -->
    <script src="../../js/data-statistics-tasks.js"></script>
    <script src="../../js/core.js"></script>

    <script>
        // === ДИАГНОСТИКА ЗАГРУЗКИ ===
        window.onload = function() {
            const debug = document.getElementById('debug-info');
            
            if (typeof statisticsTasks === 'undefined') {
                debug.style.display = 'block';
                debug.innerHTML = `
                    <strong> ОШИБКА: Массив statisticsTasks не найден!</strong><br><br>
                    Возможные причины:<br>
                    1. Файл <code>data-statistics-tasks.js</code> не загружен (проверьте путь ../../js/).<br>
                    2. В файле синтаксическая ошибка (проверьте консоль браузера F12).<br>
                    3. Переменная называется иначе (должна быть <code>const statisticsTasks = [...]</code>).
                `;
                console.error("Файл data-statistics-tasks.js не определил переменную statisticsTasks");
            } else {
                console.log(`✅ Загружено задач: ${statisticsTasks.length}`);
                // Автозагрузка первой задачи при открытии вкладки
                // loadRandomTask(); 
            }
        };

        // === ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ===
        function switchTab(tabName) {
            document.querySelectorAll('.mode-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            // Находим кнопку по тексту или индексу, тут упрощенно:
            const btns = document.querySelectorAll('.tab-btn');
            if(tabName === 'learn') btns[0].classList.add('active');
            if(tabName === 'control') btns[1].classList.add('active');
            if(tabName === 'tasks') btns[2].classList.add('active');
        }

        // === ЗАГРУЗКА ЗАДАЧИ ===
        function loadRandomTask() {
            if (typeof statisticsTasks === 'undefined') {
                alert("Данные задач не загружены! Проверьте файл data-statistics-tasks.js");
                return;
            }
            const idx = Math.floor(Math.random() * statisticsTasks.length);
            renderStatisticsTask(idx);
        }
    </script>
</body>
</html>
