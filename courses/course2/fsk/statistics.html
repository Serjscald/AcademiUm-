<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Статистика — АкадемиУм!</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <style>
        .task-wrapper { max-width: 800px; margin: 0 auto; padding: 20px; }
        .task-header { text-align: center; color: var(--gold); font-size: 22px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        
        .formula-box { background: #1e293b; border: 1px solid var(--gold); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .formula-box h4 { color: var(--gold); margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .formula-box ul { list-style: none; padding: 0; margin: 0; color: #cbd5e1; font-family: monospace; font-size: 15px; line-height: 1.8; }
        .formula-box li::before { content: "•"; color: var(--gold); margin-right: 10px; }

        .task-desc-box { background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .task-desc { color: #f8fafc; font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        
        .task-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; table-layout: fixed; }
        .task-table th, .task-table td { border: 1px solid #334155; padding: 12px 8px; text-align: center; font-size: 14px; word-wrap: break-word; }
        .task-table th { background: #334155; color: var(--gold); font-weight: bold; }
        
        .var { cursor: pointer; transition: 0.2s; font-weight: bold; border-radius: 4px; padding: 4px 8px; display: inline-block; min-width: 40px; color: #60a5fa; }
        .var:hover { filter: brightness(1.2); transform: scale(1.05); }
        
        .var-menu { position: absolute; background: #1e293b; border: 1px solid var(--gold); border-radius: 8px; padding: 5px; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: none; min-width: 160px; }
        .var-menu div { padding: 10px 15px; cursor: pointer; color: #f8fafc; border-radius: 4px; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .var-menu div:hover { background: #334155; }

        .task-footer { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 20px; }
        .counter { margin-top: 10px; font-weight: bold; color: #cbd5e1; }
        
        #solve-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; margin-top: 20px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; background: #334155; color: #64748b; pointer-events: none; }
        #solve-btn.active { background: #22c55e; color: #fff; pointer-events: auto; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }

        .solution-area { margin-top: 30px; display: none; }
        .step { background: #0f172a; border: 1px solid #22c55e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .step h3 { color: var(--gold); margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .step p { color: #e2e8f0; font-family: monospace; font-size: 15px; line-height: 1.6; margin: 8px 0; }
        
        .conclusion-box { background: #1e293b; border: 1px solid var(--gold); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .conclusion-box h4 { color: var(--gold); margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .conclusion-box p { color: #f8fafc; font-size: 16px; line-height: 1.6; margin: 0; }
        
        .back-btn { width: 100%; padding: 15px; background: #334155; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .back-btn:hover { background: #475569; }
    </style>
</head>
<body>

<div id="start-screen">
    <h2>📊 Статистика</h2>
    <p>Нажмите, чтобы начать обучение</p>
</div>

<canvas id="fireworks-canvas"></canvas>
<div class="app-container" id="app"></div>
<div class="var-menu" id="varMenu"></div>

<script src="../../../js/core.js"></script>
<script src="../../../js/data-statistics.js"></script>
<script src="../../../js/data-statistics-tasks.js"></script>
<script>
var app = document.getElementById('app');
var currentCards = []; var cardIndex = 0; var quizIndex = 0; var mistakes = 0;
var currentMode = 'learn'; var currentQuizDirection = 'term-to-def';
var currentTask = null; var taskVars = {}; var assignedVars = {}; var activeCell = null;

function renderScreen(screenName, data) {
    app.innerHTML = '';
    if (screenName === 'modes') {
        app.innerHTML = '<h1>Статистика</h1><div class="subtitle">Выберите режим</div><div class="grid" style="margin-top:40px"><div class="tile" onclick="handleMode(\'learn\')">Обучение</div><div class="tile" onclick="handleMode(\'quiz\')">Контроль</div><div class="tile" onclick="handleMode(\'tasks\')">Задачи</div></div><button class="btn btn-back" onclick="navigateTo(\'index.html\')">Назад</button>';
    } else if (screenName === 'topics') {
        var mode = (data && data.mode) ? data.mode : 'learn'; currentMode = mode;
        var title = (mode === 'learn') ? 'Обучение' : (mode === 'quiz' ? 'Контроль' : 'Задачи');
        var topicsHTML = '';
        if (mode === 'quiz') topicsHTML += '<div class="tile" onclick="startTopic(\'all\')">За все время</div>';
        if (mode === 'tasks') topicsHTML += '<div class="tile" onclick="startRandomTask()">Случайная задача</div>';
        else { for (var key in statisticsDB.topicTitles) topicsHTML += '<div class="tile" onclick="startTopic(\'' + key + '\')">' + statisticsDB.topicTitles[key] + '</div>'; }
        app.innerHTML = '<h1>' + title + '</h1><div class="subtitle">Выберите тему</div><div class="grid single-col" style="margin-top:20px">' + topicsHTML + '</div><button class="btn btn-back" onclick="renderScreen(\'modes\')">Назад</button>';
    } else if (screenName === 'flashcard') {
        var card = currentCards[cardIndex];
        app.innerHTML = '<h1>Карточка ' + (cardIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard"><div class="fc-word">' + card.word + '</div><div class="fc-trans">' + card.trans + '</div></div><button class="btn btn-orange" onclick="nextCard()">Следующая</button><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'learn\'})">Прервать</button>';
    } else if (screenName === 'quiz') {
        var qcard = currentCards[quizIndex]; currentQuizDirection = (Math.random() < 0.5) ? 'term-to-def' : 'def-to-term';
        var questionText = (currentQuizDirection === 'term-to-def') ? qcard.word : qcard.trans;
        var correctAnswer = (currentQuizDirection === 'term-to-def') ? qcard.trans : qcard.word;
        var optionsPool = currentCards.map(function(c){ return (currentQuizDirection === 'term-to-def') ? c.trans : c.word; });
        var options = [correctAnswer]; while (options.length < 3) { var rnd = optionsPool[Math.floor(Math.random() * optionsPool.length)]; if (options.indexOf(rnd) === -1) options.push(rnd); }
        options.sort(function(){ return Math.random() - 0.5; }); var optsHTML = '';
        for (var i = 0; i < options.length; i++) { var o = options[i].replace(/'/g, "\\'"); var ca = correctAnswer.replace(/'/g, "\\'"); optsHTML += '<div class="quiz-opt" onclick="checkAnswer(this,\'' + o + '\',\'' + ca + '\')">' + options[i].substring(0, 100) + (options[i].length > 100 ? '...' : '') + '</div>'; }
        app.innerHTML = '<h1>Контроль ' + (quizIndex + 1) + ' / ' + currentCards.length + '</h1><div class="flashcard" id="quiz-card"><div class="fc-word" style="font-size:20px">' + questionText + '</div><div class="fc-trans" style="font-size:14px;color:var(--text-muted)">' + (currentQuizDirection === 'term-to-def' ? 'Выберите определение:' : 'Выберите термин:') + '</div></div><div class="quiz-options">' + optsHTML + '</div><button class="btn btn-stop" onclick="renderScreen(\'topics\',{mode:\'quiz\'})">Прервать</button>';
    } else if (screenName === 'task') {
        assignedVars = {}; taskVars = {};
        var formulasHTML = '<div class="formula-box"><h4>📐 Формулы для решения:</h4><ul>';
        for (var i = 0; i < currentTask.formulas.length; i++) formulasHTML += '<li>' + currentTask.formulas[i] + '</li>';
        formulasHTML += '</ul></div>';
        
        var html = '<div class="task-wrapper">';
        html += '<div class="task-header">' + currentTask.title + '</div>';
        html += formulasHTML;
        html += '<div class="task-desc-box"><div class="task-desc">' + currentTask.description + '</div>' + currentTask.html + '</div>';
        html += '<div class="task-footer">Нажимайте на числа и выбирайте из списка, какой переменной они соответствуют. Назначение можно менять до нажатия кнопки «Решить».<div class="counter" id="varCounter">Назначено переменных: 0 / ' + currentTask.requiredVars.length + '</div></div>';
        html += '<button id="solve-btn" onclick="solveTask()">РЕШИТЬ ЗАДАЧУ</button>';
        html += '<div class="solution-area" id="solutionArea"></div>';
        html += '<button class="btn btn-back" style="margin-top:20px" onclick="renderScreen(\'topics\',{mode:\'tasks\'})">К списку задач</button>';
        html += '</div>';
        app.innerHTML = html;
        
        var varElements = document.querySelectorAll('.var');
        for (var j = 0; j < varElements.length; j++) {
            varElements[j].addEventListener('click', function(e) { e.stopPropagation(); showVarMenu(this); });
        }
        document.addEventListener('click', function() { document.getElementById('varMenu').style.display = 'none'; });
    } else if (screenName === 'result') {
        var isWin = (mistakes === 0);
        app.innerHTML = '<h1>Результат</h1><div class="result-msg ' + (isWin ? 'result-win' : 'result-lose') + '">' + (isWin ? '🎉 Отличная работа!' : 'Нужно заниматься усерднее, Данечка!') + '</div><button class="btn btn-orange" onclick="renderScreen(\'modes\')">В меню</button><button class="btn btn-back" onclick="navigateTo(\'../../../index.html\')">На главную</button>';
        if (isWin) startFireworks();
    }
}

function showVarMenu(cell) {
    activeCell = cell; var menu = document.getElementById('varMenu');
    var rect = cell.getBoundingClientRect();
    menu.style.left = (rect.left + window.scrollX) + 'px';
    menu.style.top = (rect.bottom + window.scrollY + 5) + 'px';
    
    var options = { 'p0': 'p₀ (Цена базис)', 'q0': 'q₀ (Кол-во базис)', 'p1': 'p₁ (Цена отчёт)', 'q1': 'q₁ (Кол-во отчёт)', 'rev0': 'Выручка₀ (тыс.руб.)', 'rev1': 'Выручка₁ (тыс.руб.)' };
    
    var html = '';
    for (var key in options) {
        if (currentTask.colors[key]) {
            html += '<div style="color:' + currentTask.colors[key] + '" onclick="assignVar(\'' + key + '\')">' + options[key] + '</div>';
        }
    }
    html += '<div style="color:#ef4444; border-top:1px solid #334155; margin-top:5px; padding-top:10px" onclick="clearVar()">Очистить</div>';
    menu.innerHTML = html; menu.style.display = 'block';
}

function assignVar(type) {
    if (!activeCell) return;
    var fullVar = activeCell.getAttribute('data-var');
    assignedVars[fullVar] = type;
    taskVars[fullVar] = parseFloat(activeCell.getAttribute('data-val'));
    
    var color = currentTask.colors[type] || '#fff';
    var val = activeCell.getAttribute('data-val');
    
    activeCell.innerHTML = type + ' = ' + val;
    activeCell.style.backgroundColor = color + '33';
    activeCell.style.color = color;
    activeCell.style.border = '1px solid ' + color;
    
    document.getElementById('varMenu').style.display = 'none';
    checkReady();
}

function clearVar() {
    if (!activeCell) return;
    var fullVar = activeCell.getAttribute('data-var');
    delete assignedVars[fullVar]; delete taskVars[fullVar];
    activeCell.innerHTML = activeCell.getAttribute('data-val');
    activeCell.style.backgroundColor = 'transparent';
    activeCell.style.color = '#60a5fa';
    activeCell.style.border = 'none';
    document.getElementById('varMenu').style.display = 'none';
    checkReady();
}

function checkReady() {
    var count = Object.keys(assignedVars).length;
    document.getElementById('varCounter').innerText = 'Назначено переменных: ' + count + ' / ' + currentTask.requiredVars.length;
    var ready = (count === currentTask.requiredVars.length);
    var btn = document.getElementById('solve-btn');
    if (ready) btn.classList.add('active'); else btn.classList.remove('active');
}

function solveTask() {
    var result = currentTask.solve(taskVars);
    var html = result.calc;
    html += '<div class="conclusion-box"><h4>📝 Вывод:</h4><p>' + result.conclusion + '</p></div>';
    html += '<button class="back-btn" onclick="startRandomTask()">К СПИСКУ ЗАДАЧ</button>';
    
    var area = document.getElementById('solutionArea');
    area.innerHTML = html; area.style.display = 'block';
    document.getElementById('solve-btn').style.display = 'none';
    playSound('success');
    area.scrollIntoView({ behavior: 'smooth' });
}

function handleMode(mode) { event.target.classList.add('success'); playSound('success'); setTimeout(function(){ renderScreen('topics', {mode: mode}); }, 400); }
function startTopic(scope) {
    event.target.classList.add('success'); playSound('success');
    if (scope === 'all') { currentCards = []; for (var key in statisticsDB.topicTitles) currentCards = currentCards.concat(statisticsDB[key]); } 
    else { currentCards = statisticsDB[scope].slice(); }
    currentCards.sort(function(){ return Math.random() - 0.5; });
    if (currentMode === 'learn') { cardIndex = 0; setTimeout(function(){ renderScreen('flashcard'); }, 400); } 
    else { quizIndex = 0; mistakes = 0; setTimeout(function(){ renderScreen('quiz'); }, 400); }
}
function startRandomTask() {
    if(event && event.target) { event.target.classList.add('success'); playSound('success'); }
    currentTask = statisticsTasks[Math.floor(Math.random() * statisticsTasks.length)];
    setTimeout(function(){ renderScreen('task'); }, 400);
}
function nextCard() { playSound('success'); cardIndex++; if (cardIndex < currentCards.length) renderScreen('flashcard'); else renderScreen('topics', {mode: 'learn'}); }
function checkAnswer(el, selected, correct) {
    var card = document.getElementById('quiz-card');
    if (selected === correct) { el.classList.add('correct'); card.classList.add('correct-flash'); playSound('success'); } 
    else { el.classList.add('wrong'); card.classList.add('wrong-flash'); playSound('error'); mistakes++; }
    setTimeout(function(){ quizIndex++; if (quizIndex < currentCards.length) renderScreen('quiz'); else renderScreen('result'); }, 600);
}
var startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', function(){ initAudio(); startScreen.style.opacity = '0'; setTimeout(function(){ startScreen.style.display = 'none'; }, 500); renderScreen('modes'); });
</script>
</body>
</html>
