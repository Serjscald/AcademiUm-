<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2 курс — АкадемиУм!</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div id="start-screen">
    <h2>🎓 2 курс</h2>
    <p>Нажмите, чтобы выбрать факультет</p>
</div>

<canvas id="fireworks-canvas"></canvas>

<div class="app-container" id="app">
    <h1>2 курс</h1>
    <div class="subtitle">Выберите факультет</div>
    <div class="grid single-col" style="margin-top: 20px;">
        <div class="tile" onclick="handleTileClick(this, true, function(){ navigateTo('fsk/index.html'); })">ФСК</div>
        <div class="tile" onclick="handleTileClick(this, false)">Другой факультет</div>
    </div>
    <button class="btn btn-back" onclick="navigateTo('../../index.html')">Назад</button>
</div>

<script src="../../js/core.js"></script>
<script>
    var startScreen = document.getElementById('start-screen');
    startScreen.addEventListener('click', function(){
        initAudio();
        startScreen.style.opacity = '0';
        setTimeout(function(){ startScreen.style.display = 'none'; }, 500);
    });
</script>
</body>
</html>
