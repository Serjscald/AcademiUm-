<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АкадемиУм!</title>
    <link rel="stylesheet" href="css/style.css?v=6.16.0">
</head>
<body>

<div id="start-screen">
    <h2>🎓 АкадемиУм!</h2>
    <p>Нажмите, чтобы начать обучение</p>
</div>

<canvas id="fireworks-canvas"></canvas>

<div class="app-container" id="app">
    <h1>АкадемиУм!</h1>
  <div class="version">Версия 6.17.1</div>
    <div class="subtitle">Учебно-игровая платформа</div>
    <img src="photo.jpg" class="hero-img" alt="Студенты" onerror="this.style.display='none'">
                 <div class="grid single-col" style="margin-top: 20px;">
            <div class="tile" onclick="handleTileClick(this, true, function(){ navigateTo('courses/course1/index.html'); })">1 курс</div>
            <div class="tile" onclick="handleTileClick(this, true, function(){ navigateTo('courses/course2/fsk/index.html'); })">2 курс</div>
            <div class="tile" onclick="handleTileClick(this, false)">3 курс</div>
            <div class="tile" onclick="handleTileClick(this, false)">4 курс</div>
            <div class="tile" onclick="handleTileClick(this, false)">5 курс</div>
        </div>
        </div>
</div>

<script src="js/core.js?v=6.16.0"></script>
<script>
    var startScreen = document.getElementById('start-screen');
    startScreen.addEventListener('click', function(){
        initAudio();
        startScreen.style.opacity = '0';
        setTimeout(function(){ startScreen.style.display = 'none'; }, 500);
    });
</script>
</body>
</html>
